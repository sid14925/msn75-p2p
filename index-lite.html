function openChat(pid) {
  let w = chatWins.get(pid);
  if (w) { w.win.style.display = 'flex'; bringToFront(w.win); mobileShow(w.win); return w; }

  const win = el('div', 'win chatwin');
  win.style.left = (340 + (cascade % 6) * 34) + 'px';
  win.style.top = (20 + (cascade % 6) * 28) + 'px';
  placeChatWin(win, cascade);
  cascade++;
  win.innerHTML = chatTemplate(pid);
  document.body.appendChild(win);
  makeDraggable(win, $('.titlebar', win));
  bringToFront(win);
  addMobileBack(win);
  mobileShow(win);

  w = {
    win,
    title: $('.t-text', win),
    toLine: $('.to-line', win),
    msgs: $('.msgs', win),
    status: $('.chat-status', win),
    ta: $('textarea', win),
    sbar: $('.stream-bar', win),
    typingTimer: null,
    lastTypeSent: 0,
    lastMsgAt: null,
    recorder: null,
    reply: null,
  };
  chatWins.set(pid, w);
  refreshChatHead(pid);
  bindDpZoom(win);

  buildMenus($('.chat-menubar', win), [
    { label: t('menuFile'), items: [
      { label: t('miSendFile'), act: 'sendfile' },
      { label: t('miSaveTxt'), act: 'savetxt' },
      '-',
      { label: t('miClose'), act: 'close' },
    ]},
    { label: t('menuEdit'), items: [
      { label: t('cut'), dis: true }, { label: t('copy'), dis: true }, { label: t('paste'), dis: true },
    ]},
    { label: t('menuActions'), items: [
      { label: t('miNudge'), act: 'nudge' },
      { label: t('miVoiceCall'), act: 'voice' },
      { label: t('miWebcam'), act: 'webcam' },
      { label: t('youStream'), act: 'stream' },
      { label: t('tbInvite'), act: 'invite' },
      { label: t('miSendFile'), act: 'sendfile' },
    ]},
    { label: t('menuTools'), items: [
      { label: muted ? t('miSoundsOn') : t('miSoundsOff'), act: 'mute' },
      { label: t('settingsTitle') + '…', act: 'settings' },
    ]},
    { label: t('menuHelp'), items: [
      { label: t('miAbout'), act: 'about' },
    ]},
  ], act => runChatAction(pid, act));

  const fIn = document.createElement('input');
  fIn.type = 'file';
  fIn.style.display = 'none';
  win.appendChild(fIn);
  fIn.addEventListener('change', () => {
    const f = fIn.files && fIn.files[0];
    fIn.value = '';
    if (f) offerFile(pid, f);
  });
  w.fileInput = fIn;

  // Gemini gomb a chatben
  const gBtn = $('.gemini-btn', win);
  if (gBtn) {
    gBtn.addEventListener('click', () => {
      if (pid === 'gemini') {
        w.ta.focus();
      } else {
        if (!w.ta.value.startsWith('@gemini ')) {
          w.ta.value = '@gemini ' + w.ta.value;
        }
        w.ta.focus();
      }
    });
  }

  // Thinking toggle gomb a Gemini chat fejlécében
  const thToggle = $('#geminiThinkingToggle', win);
  if (thToggle) {
    thToggle.addEventListener('click', () => {
      geminiState.thinking = geminiState.thinking === 'high' ? 'low' : 'high';
      saveGeminiState();
      thToggle.className = 'thinking-badge ' + (geminiState.thinking === 'high' ? 'high' : '');
      thToggle.textContent = '🧠 ' + (geminiState.thinking === 'high' ? 'High Thinking' : 'Low Thinking') + ' ▾';
      renderContacts();
    });
  }

  // válasz-sáv
  const rbar = $('.reply-bar', win);
  $('.rx', rbar).addEventListener('click', () => { w.reply = null; rbar.classList.remove('on'); });

  const send = () => {
    const text = w.ta.value.trim();
    if (!text) return;

    if (pid === 'gemini') {
      const fmt = { color: sanitizeColor(myFmt.color) || undefined, bold: !!myFmt.bold || undefined, italic: !!myFmt.italic || undefined, font: sanitizeFont(myFmt.font) || undefined };
      addMsg(pid, me.name, text, true, fmt, undefined, { msgId: 'm_' + Date.now() });
      w.ta.value = '';
      w.ta.focus();
      handleGeminiDirectChat(text);
      return;
    }

    const c = conns.get(pid);
    if (!c || !c.open) {
      sysMsg(pid, t('notAvail'));
      connectTo(pid);
      return;
    }
    const fmt = { color: sanitizeColor(myFmt.color) || undefined, bold: !!myFmt.bold || undefined, italic: !!myFmt.italic || undefined, font: sanitizeFont(myFmt.font) || undefined };
    const rp = w.reply ? { n: w.reply.n, x: w.reply.x, th: w.reply.th || undefined } : undefined;
    const mid = me.baseId + '_' + Date.now() + '_' + (++msgIdCounter);
    sendTo(pid, { t: 'msg', text, fmt, rp, mid });
    addMsg(pid, me.name, text, true, fmt, rp, { msgId: mid });
    w.reply = null;
    rbar.classList.remove('on');
    w.ta.value = '';
    w.ta.focus();

    if (/@(gemini|ai)\b/i.test(text) && geminiState.enabled) {
      handleGeminiMention(pid, text);
    }
  };
  $('.send-btn', win).addEventListener('click', send);
  w.ta.addEventListener('keydown', e => {
    if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); send(); }
  });
  w.ta.addEventListener('input', () => {
    if (pid === 'gemini') return;
    const c = conns.get(pid);
    const tt = Date.now();
    if (c && c.open && tt - w.lastTypeSent > 2000) { c.send({ t: 'typing' }); w.lastTypeSent = tt; }
  });

  // vágólapról beillesztett kép (Ctrl+V) — azonnal megy
  w.ta.addEventListener('paste', e => {
    const items = e.clipboardData && e.clipboardData.items;
    if (!items) return;
    for (const it of items) {
      if (it.kind === 'file' && (it.type || '').startsWith('image/')) {
        const f = it.getAsFile();
        if (f) {
          e.preventDefault();
          const named = f.name && f.name !== 'image.png'
            ? f
            : new File([f], 'vagolap-' + randId() + '.' + ((f.type.split('/')[1]) || 'png'), { type: f.type });
          sendImage(pid, named);
        }
        return;
      }
    }
  });

  // fájl/kép behúzása az ablakba
  const drop = el('div', 'drop-overlay');
  drop.textContent = t('dropHere');
  win.appendChild(drop);
  let dragDepth = 0;
  win.addEventListener('dragenter', e => {
    if (!e.dataTransfer || ![...e.dataTransfer.types].includes('Files')) return;
    e.preventDefault();
    dragDepth++;
    drop.classList.add('on');
  });
  win.addEventListener('dragover', e => {
    if (!e.dataTransfer || ![...e.dataTransfer.types].includes('Files')) return;
    e.preventDefault();
    e.dataTransfer.dropEffect = 'copy';
  });
  win.addEventListener('dragleave', () => {
    dragDepth = Math.max(0, dragDepth - 1);
    if (!dragDepth) drop.classList.remove('on');
  });
  win.addEventListener('drop', e => {
    if (!e.dataTransfer) return;
    e.preventDefault();
    dragDepth = 0;
    drop.classList.remove('on');
    const files = [...(e.dataTransfer.files || [])];
    for (const f of files) offerFile(pid, f);
  });

  const fontPop = $('.font-pop', win);
  $('.font-btn', win).addEventListener('click', e => {
    e.stopPropagation();
    fontPop.classList.toggle('open');
    $('.bg-pop', win).classList.remove('open');
    $('.wink-pop', win).classList.remove('open');
  });
  $('.fmt-font', win).addEventListener('change', e => {
    myFmt.font = e.target.value || '';
    saveFmt();
    // az összes megnyitott ablak választója kövesse a beállítást
    document.querySelectorAll('.fmt-font').forEach(sel => { sel.value = myFmt.font; });
  });
  $('.fmt-color', win).addEventListener('input', e => { myFmt.color = e.target.value; saveFmt(); });
  $('.fmt-b', win).addEventListener('click', e => {
    myFmt.bold = !myFmt.bold;
    e.currentTarget.classList.toggle('toggled', myFmt.bold);
    saveFmt();
  });
  $('.fmt-i', win).addEventListener('click', e => {
    myFmt.italic = !myFmt.italic;
    e.currentTarget.classList.toggle('toggled', myFmt.italic);
    saveFmt();
  });

  const bgPop = $('.bg-pop', win);
  for (const [id, css] of BGS) {
    const cell = el('span', 'bg-cell');
    cell.style.background = css;
    cell.title = id;
    cell.addEventListener('click', () => {
      w.msgs.style.background = css;
      bgPop.classList.remove('open');
      const c = conns.get(pid);
      if (c && c.open) c.send({ t: 'bg', id });
    });
    bgPop.appendChild(cell);
  }
  $('.bg-btn', win).addEventListener('click', e => {
    e.stopPropagation();
    bgPop.classList.toggle('open');
    fontPop.classList.remove('open');
    $('.wink-pop', win).classList.remove('open');
  });

  // kacsintók
  const wkPop = $('.wink-pop', win);

function runChatAction(pid, act) {
  const w = chatWins.get(pid);
  if (!w) return;
  if (act === 'close') { w.win.style.display = 'none'; mobileBack(); }
  else if (act === 'nudge') w.doNudge();
  else if (act === 'stream') startStream(pid);
  else if (act === 'stopstream') stopStream(pid);
  else if (act === 'sendfile') w.fileInput.click();
  else if (act === 'savetxt') exportChatTxt(pid);
  else if (act === 'voice') startCall(pid, 'voice');
  else if (act === 'webcam') startCall(pid, 'webcam');
  else if (act === 'invite') {
    pickContact([pid], pid2 => {
      const gid = randId();
      const g = { gid, members: new Map([[me.id, me.name], [pid, dispName(pid)], [pid2, dispName(pid2)]]), w: null };
      groups.set(gid, g);
      const inv = { t: 'ginv', gid, ms: groupMembersArr(g) };
      for (const id of [pid, pid2]) {
        const c = conns.get(id);
        if (c && c.open) c.send(inv);
      }
      openGroupWin(g);
      refreshGroupHead(g);
      gSysMsg(g, tf('joined', dispName(pid2)));
    });
  }
  else if (act === 'mute') {
    muted = !muted;
    localStorage.setItem('msn75_muted', muted ? '1' : '0');
    buildMainMenus();
  } else if (act === 'settings') {
    openSettings();
  } else if (act === 'about') {
    sysMsg(pid, t('aboutText'));
  }
}

// üzenet szerkesztése (inline)
function startEditMsg(pid, msgEl, mid, fmt) {
  const body = msgEl.querySelector('.m-body');
  if (!body || msgEl.querySelector('.edit-area')) return;
  const oldText = body.textContent;
  body.style.display = 'none';
  const area = document.createElement('textarea');
  area.className = 'edit-area';
  area.value = oldText;
  area.rows = Math.max(2, Math.ceil(oldText.length / 60));
  msgEl.insertBefore(area, body.nextSibling);
  area.focus();
  area.selectionStart = area.selectionEnd = area.value.length;
  const save = () => {
    const newText = area.value.trim();
    area.remove();
    body.style.display = '';
    if (!newText || newText === oldText) return;
    body.innerHTML = renderBody(newText);
    msgEl.setAttribute('data-msg-text', String(newText).slice(0, 200));
    let ed = msgEl.querySelector('.m-edited');
    if (!ed) { ed = document.createElement('span'); ed.className = 'm-edited'; ed.textContent = t('edited'); msgEl.querySelector('.m-head').appendChild(ed); }
    // szerkesztés küldése a partnernek
    sendTo(pid, { t: 'msg-edit', mid, text: newText });
  };
  area.addEventListener('keydown', e => {
    if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); save(); }
    if (e.key === 'Escape') { area.remove(); body.style.display = ''; }
  });
  area.addEventListener('blur', save);
}

// ---------- hangüzenet ----------
async function toggleVclip(pid, w) {
  const btn = $('.vclip-btn', w.win);
  if (w.recorder) { w.recorder.stop(); return; }
  const c = conns.get(pid);
  if (!c || !c.open) { sysMsg(pid, t('notAvailShort')); return; }
  let stream;
  try {
    stream = await navigator.mediaDevices.getUserMedia({ audio: true });
  } catch {
    sysMsg(pid, t('micDenied'));
    return;
  }
  const chunks = [];
  const rec = new MediaRecorder(stream);
  w.recorder = rec;
  btn.classList.add('rec');
  let secs = 0;
  const t0 = btn.innerHTML;
  const timer = setInterval(() => {
    secs++;
    btn.innerHTML = '■ 0:' + String(secs).padStart(2, '0');
    if (secs >= 15) rec.stop(); // az eredeti MSN 7.5 limitje
  }, 1000);
  rec.ondataavailable = e => { if (e.data.size) chunks.push(e.data); };
  rec.onstop = async () => {
    clearInterval(timer);
    btn.classList.remove('rec');
    btn.innerHTML = t0;
    w.recorder = null;
    stream.getTracks().forEach(tk => tk.stop());
    const blob = new Blob(chunks, { type: rec.mimeType || 'audio/webm' });
    if (!blob.size) return;
    const buf = await blob.arrayBuffer();
    const cc = conns.get(pid);
    if (cc && cc.open) {
      cc.send({ t: 'vclip', mime: blob.type, data: buf });
      addVclip(pid, me.name, blob, true);
    }
  };
  rec.start();
}

function onVclip(pid, d) {
  openChat(pid);
  let bytes = d.data;
  if (bytes instanceof ArrayBuffer) bytes = new Uint8Array(bytes);
  if (!bytes || !bytes.length || bytes.length > 3000000) return;
  const blob = new Blob([bytes], { type: typeof d.mime === 'string' && d.mime.startsWith('audio/') ? d.mime : 'audio/webm' });
  addVclip(pid, dispName(pid), blob, false);
  sndMsg();
}

function addVclip(pid, name, blob, mine) {
  const w = openChat(pid);
  const m = el('div', 'msg' + (mine ? ' mine' : ''));
  const h = el('div', 'm-head');
  h.innerHTML = tf('vclipSent', escHtml(name)) + '<span class="m-time">' + now() + '</span>';

}

// ---------- fájlküldés ----------
const CHUNK = 262144;        // 256 KB darabok — maximális áteresztéshez
const BUF_LIMIT = 8388608;   // 8 MB WebRTC-puffer fölött rövid várakozás

function fileLine(pid, name, size, mine) {

  return box;
}

// Mégse gomb hozzáadása egy folyamatban lévő átvitelhez
function addCancelBtn(box, onCancel) {
  let btns = box.querySelector('.f-btns');
  if (!btns) { btns = el('div', 'f-btns'); box.appendChild(btns); }
  btns.innerHTML = '';
  const b = el('button', 'xp-btn cancel-btn', t('cancelTransfer'));
  b.addEventListener('click', e => { e.stopPropagation(); onCancel(); b.remove(); });
  btns.appendChild(b);
  return b;
}

function offerFile(pid, file) {
  const c = conns.get(pid);
  if (!c || !c.open) { sysMsg(pid, t('fCantSend')); return; }
  // képeket és videókat azonnal küldünk, elfogadás-kérdés nélkül
  if ((file.type || '').startsWith('image/') && file.size <= IMG_INSTANT_MAX) {
    return sendImage(pid, file);
  }
  if ((file.type || '').startsWith('video/') && file.size <= VID_MAX) {
    return sendVideo(pid, file);
  }
  const id = randId();
  const box = fileLine(pid, file.name, file.size, true);
  box.querySelector('.f-size').textContent = fmtSize(file.size) + t('fOfferWait');
  const tx = { dir: 'out', pid, file, lineEl: box, cancelled: false };
  fileTx.set(id, tx);
  addCancelBtn(box, () => {
    tx.cancelled = true;
    fileTx.delete(id);
    box.querySelector('.f-size').textContent = t('fCancelled');
    const cc = conns.get(pid);
    if (cc && cc.open) cc.send({ t: 'file-cancel', id });
  });
  c.send({ t: 'file-offer', id, name: file.name.slice(0, 120), size: file.size, mime: file.type || 'application/octet-stream' });

// ---------- azonnali képküldés ----------
const IMG_INSTANT_MAX = 16777216;
const imgSending = new Map(); // folyamatban levo kepkuldesek // 16 MB-ig azonnali kép, felette fájlátvitel

async function sendImage(pid, file) {
  const c = conns.get(pid);
  if (!c || !c.open) { sysMsg(pid, t('fCantSend')); return; }
  const id = randId();
  let buf;
  try { buf = await file.arrayBuffer(); } catch { return; }
  const mime = file.type || 'image/png';
  const name = (file.name || 'kep.png').slice(0, 120);
  const blob = new Blob([buf], { type: mime });
  const ui = addImageMsg(pid, me.name, blob, name, true);
  const st = { cancelled: false };
  imgSending.set(id, st);
  const total = buf.byteLength;
  // nagyobb kepnel megjelenik a Megse gomb
  if (ui && ui.line && total > CHUNK) {
    const btns = el('div', 'f-btns');
    const b = el('button', 'xp-btn cancel-btn', t('cancelTransfer'));
    b.addEventListener('click', () => {
      st.cancelled = true;
      const cc = conns.get(pid);
      if (cc && cc.open) cc.send({ t: 'img-cancel', id });
      btns.textContent = t('fCancelled');
    });
    btns.appendChild(b);
    ui.line.appendChild(btns);
    st.btns = btns;
  }
  c.send({ t: 'img-start', id, name, mime, size: total });
  let sent = 0;
  while (sent < total) {
    if (st.cancelled) { imgSending.delete(id); return; }
    while (c.dataChannel && c.dataChannel.bufferedAmount > BUF_LIMIT) {
      await new Promise(r => setTimeout(r, 10));
      if (!c.open || st.cancelled) { imgSending.delete(id); return; }
    }
    const end = Math.min(sent + CHUNK, total);
    c.send({ t: 'img-chunk', id, last: end >= total, data: buf.slice(sent, end) });
    sent = end;
  }
  imgSending.delete(id);
  if (st.btns) st.btns.remove();
}

// ---------- videóküldés (menet közben nézhető) ----------
const VID_MAX = 536870912; // 512 MB

// A videót NEM küldjük el automatikusan: csak egy ajánlat megy át
// (név, méret, előnézeti kocka). A fogadó a lejátszás gombbal indíthat
// streamelést, a mentés gombbal pedig a teljes letöltést.
const vidOffers = new Map(); // id -> { pid, file }

async function sendVideo(pid, file) {
  const c = conns.get(pid);
  if (!c || !c.open) { sysMsg(pid, t('fCantSend')); return; }
  const id = randId();
  const mime = file.type || 'video/mp4';
  const name = (file.name || 'video.mp4').slice(0, 120);
  vidOffers.set(id, { pid, file });
  addVideoMsg(pid, me.name, URL.createObjectURL(file), name, true, file.size, file.size);
  const poster = await videoPoster(file);
  c.send({ t: 'vid-offer', id, name, mime, size: file.size, poster: poster || undefined });
}

// első kocka előnézetnek (hogy legyen mit mutatni letöltés nélkül)
function videoPoster(file) {
  return new Promise(res => {
    try {
      const v = document.createElement('video');
      v.preload = 'metadata';
      v.muted = true;
      const url = URL.createObjectURL(file);
      v.src = url;
      let done = false;
      const finish = val => { if (done) return; done = true; URL.revokeObjectURL(url); res(val); };
      v.addEventListener('loadeddata', () => {
        try {
          const cv = document.createElement('canvas');
          const w = Math.min(320, v.videoWidth || 320);
          cv.width = w;
          cv.height = Math.round(w * ((v.videoHeight || 180) / (v.videoWidth || 320)));
          cv.getContext('2d').drawImage(v, 0, 0, cv.width, cv.height);
          finish(cv.toDataURL('image/jpeg', 0.7));
        } catch { finish(null); }
      });
      v.addEventListener('error', () => finish(null));
      setTimeout(() => finish(null), 4000);
      v.currentTime = 0.1;
    } catch { res(null); }
  });
}

// a fogadó kérésére indul az átvitel (stream vagy teljes letöltés)
async function onVidRequest(pid, d) {
  const off = vidOffers.get(d.id);
  if (!off || off.pid !== pid) return;
  const c = conns.get(pid);
  if (!c || !c.open) return;
  const file = off.file;
  const total = file.size;
  const mode = d.mode === 'save' ? 'save' : 'stream';
  off.stopped = false;
  vidSending.set(d.id, off);
  c.send({ t: 'vid-start', id: d.id, name: file.name, mime: file.type || 'video/mp4',
           size: total, mode });
  // Streamelésnél kisebb elore-puffert tartunk: csak annyit kuldunk,
  // amennyit a masik oldal eppen nez. Mentesnél teljes sebesseggel megy.
  const STREAM_AHEAD = 3145728; // 3 MB elore-puffer
  let sent = 0;
  while (sent < total) {
    if (off.stopped || !c.open) { vidSending.delete(d.id); return; }
    const limit = mode === 'stream' ? Math.min(BUF_LIMIT, STREAM_AHEAD) : BUF_LIMIT;
    while (c.dataChannel && c.dataChannel.bufferedAmount > limit) {
      await new Promise(r => setTimeout(r, 40));
      if (off.stopped || !c.open) { vidSending.delete(d.id); return; }
    }
    const end = Math.min(sent + CHUNK, total);
    const part = await file.slice(sent, end).arrayBuffer();
    c.send({ t: 'vid-chunk', id: d.id, last: end >= total, data: part });
    sent = end;
  }
  vidSending.delete(d.id);
}

// folyamatban lévő küldések (leállíthatók, ha a másik fél abbahagyja)
const vidSending = new Map();
function onVidStop(pid, d) {
  const off = vidSending.get(d.id);
  if (off && off.pid === pid) off.stopped = true;
}

// beérkező ajánlat: csak előnézet, semmit nem töltünk le
function onVidOffer(pid, d) {
  if (typeof d.size !== 'number' || d.size < 0 || d.size > VID_MAX) return;
  const isNew = !chatWins.has(pid) || chatWins.get(pid).win.style.display === 'none';
  openChat(pid);
  const name = String(d.name || 'video.mp4').slice(0, 120);
  const poster = typeof d.poster === 'string' && d.poster.startsWith('data:image/') &&
    d.poster.length < 400000 ? d.poster : null;
  addVideoOffer(pid, dispName(pid), d.id, name, d.size, poster);
  if (isNew) sndAlert(); else sndMsg();
}

const vidRx = new Map(); // id -> fogadási állapot

// beérkező videó-ajánlat megjelenítése (letöltés nélkül)
function addVideoOffer(pid, name, offerId, fileName, size, poster) {
  const w = openChat(pid);
  const m = el('div', 'msg');
  const h = el('div', 'm-head');
  h.innerHTML = tf('vidSent', escHtml(name)) + '<span class="m-time">' + now() + '</span>';
  m.appendChild(h);
  const line = el('div', 'vid-msg');
  const box = el('div', 'vid-offer');
  if (poster) {
    const im = document.createElement('img');
    im.src = poster;
    im.className = 'vid-poster';
    box.appendChild(im);
  } else {
    box.appendChild(el('div', 'vid-noposter', '🎬'));
  }
  const play = el('span', 'vid-play', '▶');
  box.appendChild(play);
  line.appendChild(box);
  const info = el('div', 'vid-info', fileName + ' — ' + fmtSize(size));
  line.appendChild(info);
  const btns = el('div', 'f-btns');
  const save = el('button', 'xp-btn', t('fSave'));
  btns.appendChild(save);
  line.appendChild(btns);
  m.appendChild(line);
  w.msgs.appendChild(m);
  w.msgs.scrollTop = w.msgs.scrollHeight;

  // válasz erre a videóra
  const rb = el('span', 'reply-btn', '↩');
  rb.title = t('replyBtn');
  rb.addEventListener('click', e => {
    e.stopPropagation();
    w.reply = { n: name, x: '🎬 ' + (fileName || 'video'), th: poster || undefined };
    const rbar = $('.reply-bar', w.win);
    $('.rq', rbar).innerHTML = (poster ? '<img class="rq-th" src="' + poster + '" alt="">' : '') +
      escHtml(name + ': 🎬 ' + (fileName || 'video'));
    rbar.classList.add('on');
    w.ta.focus();
  });
  m.appendChild(rb);

  const ask = mode => {
    const c = conns.get(pid);
    if (!c || !c.open) { sysMsg(pid, t('notAvailShort')); return; }
    pendingVid.set(offerId, { pid, fileName, size, mode, line, box, info, btns });
    info.textContent = fileName + ' — ' + (mode === 'save' ? t('fRecv') : t('vidBuffering'));
    c.send({ t: 'vid-request', id: offerId, mode });
  };
  // egyetlen kérés menjen el (a gomb a dobozon belül van)
  let asked = false;
  const askOnce = mode => { if (asked) return; asked = true; ask(mode); };
  play.addEventListener('click', e => { e.stopPropagation(); askOnce('stream'); });
  box.addEventListener('click', () => askOnce('stream'));
  save.addEventListener('click', e => { e.stopPropagation(); askOnce('save'); });
}

const pendingVid = new Map();

function onVidStart(pid, d) {
  if (typeof d.size !== 'number' || d.size < 0 || d.size > VID_MAX) return;
  const mime = String(d.mime || '').startsWith('video/') ? d.mime : 'video/mp4';
  const name = String(d.name || 'video.mp4').slice(0, 120);
  const pend = pendingVid.get(d.id);
  if (!pend || pend.pid !== pid) return; // csak kért videót fogadunk
  pendingVid.delete(d.id);
  openChat(pid);
  // az ajánlat-előnézetet lecseréljük élő lejátszóra
  pend.box.remove();
  pend.btns.remove();
  const ui = attachVideoPlayer(pend.line, pend.info, name, d.size, pend.mode);
  {
    // az atvitel barmikor megszakithato
    const cbtns = el('div', 'f-btns');
    const cb = el('button', 'xp-btn cancel-btn', t('cancelTransfer'));
    cb.addEventListener('click', () => {
      const cc = conns.get(pid);
      if (cc && cc.open) cc.send({ t: 'vid-stop', id: d.id });
      vidRx.delete(d.id);
      cbtns.textContent = t('fCancelled');
    });
    cbtns.appendChild(cb);
    pend.line.appendChild(cbtns);
  }
  const rx = { pid, name, mime, size: d.size, got: 0, parts: [], ui, ms: null, sb: null,
               queue: [], mode: pend.mode };

  // Ha a böngésző tudja folyamatosan fűzni a darabokat, már letöltés
  // közben nézhető a videó (mint egy streamnél).
  try {
    if (window.MediaSource && MediaSource.isTypeSupported(mime)) {
      const ms = new MediaSource();
      rx.ms = ms;
      ui.video.src = URL.createObjectURL(ms);
      ms.addEventListener('sourceopen', () => {
        try {
          rx.sb = ms.addSourceBuffer(mime);
          rx.sb.addEventListener('updateend', () => pumpVid(rx));
          pumpVid(rx);
        } catch { rx.ms = null; rx.sb = null; }
      });
    }
  } catch { rx.ms = null; }

  vidRx.set(d.id, rx);
  if (rx.mode === 'stream') ui.video.play().catch(() => {});
}

// lejátszó + folyamatjelző beillesztése a meglévő üzenetbe
function attachVideoPlayer(line, info, fileName, size, mode) {
  const video = document.createElement('video');
  video.controls = true;
  video.playsInline = true;
  video.autoplay = mode === 'stream';
  line.insertBefore(video, info);
  const prog = el('div', 'f-prog');
  prog.innerHTML = '<div></div>';
  line.appendChild(prog);
  const dl = document.createElement('a');
  dl.className = 'img-dl';
  dl.textContent = t('fSave');
  dl.download = fileName || 'video.mp4';
  dl.style.display = 'none';
  line.appendChild(dl);
  return {
    video, line,
    setProgress(pct, g, sz) {
      prog.firstChild.style.width = pct + '%';
      info.textContent = fileName + ' — ' + fmtSize(g) + ' / ' + fmtSize(sz) + ' (' + pct + '%)';
    },
    finish(u) {
      prog.remove();
      info.textContent = fileName + ' — ' + fmtSize(size);
      dl.href = u;
      dl.style.display = '';
      if (mode === 'save') { try { dl.click(); } catch {} }
    },
  };
}

function pumpVid(rx) {
  if (!rx.sb || rx.sb.updating || !rx.queue.length) {
    if (rx.done && rx.sb && !rx.sb.updating && !rx.queue.length && rx.ms &&
        rx.ms.readyState === 'open') {
      try { rx.ms.endOfStream(); } catch {}
    }
    return;
  }
  try { rx.sb.appendBuffer(rx.queue.shift()); } catch { rx.sb = null; }
}

function onVidChunk(pid, d) {
  const rx = vidRx.get(d.id);
  if (!rx || rx.pid !== pid) return;
  let bytes = d.data;
  if (bytes instanceof ArrayBuffer) bytes = new Uint8Array(bytes);
  if (!bytes) return;
  rx.got += bytes.byteLength || bytes.length || 0;
  if (rx.sb || rx.ms) rx.queue.push(bytes);
  rx.parts.push(bytes);
  const pct = rx.size ? Math.min(100, Math.round(rx.got / rx.size * 100)) : 0;
  rx.ui.setProgress(pct, rx.got, rx.size);
  if (rx.sb) pumpVid(rx);
  if (d.last) {
    rx.done = true;
    const blob = new Blob(rx.parts, { type: rx.mime });
    const url = URL.createObjectURL(blob);
    rx.ui.finish(url);
    if (rx.sb) pumpVid(rx);
    else rx.ui.video.src = url;
    vidRx.delete(d.id);
    sndMsg();
    pushHist(pid, { k: 's', x: '🎬 ' + tf('vidSent', dispName(pid)) + ' ' + rx.name });
  }
}

// kis (max 48 px) előnézet készítése az idézethez
function makeThumb(imgEl, cb) {
  const draw = () => {
    try {
      const max = 48;
      const r = Math.min(max / imgEl.naturalWidth, max / imgEl.naturalHeight, 1);
      const cv = document.createElement('canvas');
      cv.width = Math.max(1, Math.round(imgEl.naturalWidth * r));
      cv.height = Math.max(1, Math.round(imgEl.naturalHeight * r));
      cv.getContext('2d').drawImage(imgEl, 0, 0, cv.width, cv.height);
      cb(cv.toDataURL('image/jpeg', 0.6));
    } catch { cb(null); }
  };
  if (imgEl.complete && imgEl.naturalWidth) draw();
  else imgEl.addEventListener('load', draw, { once: true });
}

function onFileOffer(pid, d) {
  if (typeof d.size !== 'number' || d.size < 0) return;
  openChat(pid);
  const name = String(d.name || 'file').slice(0, 120);
  const box = fileLine(pid, name, d.size, false);
  const btns = box.querySelector('.f-btns');
  const ok = el('button', 'xp-btn', t('accept'));
  const no = el('button', 'xp-btn', t('decline'));
  btns.appendChild(ok); btns.appendChild(no);
  sndAlert();
  const mime = String(d.mime || '');
  const tx = { dir: 'in', pid, name, size: d.size, mime, parts: [], got: 0, lineEl: box, writable: null, wq: Promise.resolve() };
  fileTx.set(d.id, tx);
  ok.addEventListener('click', async () => {
    // a Mégse gomb azonnal elérhető legyen (a mentési hely kiválasztása előtt is)
    btns.innerHTML = '';
    box.querySelector('.f-size').textContent = fmtSize(d.size) + t('fRecv');
    addCancelBtn(box, () => {
      tx.cancelled = true;
      fileTx.delete(d.id);
      box.querySelector('.f-size').textContent = t('fCancelled');
      const cc = conns.get(pid);
      if (cc && cc.open) cc.send({ t: 'file-cancel', id: d.id });
    });
    // nagy, nem képi fájloknál közvetlenül a lemezre mentünk (ha a
    // böngésző támogatja) — így nincs memórialimit
    const preferMemory = mime.startsWith('image/') && d.size < 52428800;
    if (window.showSaveFilePicker && !preferMemory) {
      try {
        const h = await window.showSaveFilePicker({ suggestedName: name });
        tx.writable = await h.createWritable();
      } catch {
        tx.writable = null; // mégsem választott helyet — memóriában fogadjuk
      }
    }
    if (tx.cancelled) return;
    const c = conns.get(pid);
    if (c && c.open) c.send({ t: 'file-accept', id: d.id });
  });
  no.addEventListener('click', () => {
    btns.innerHTML = '';
    box.querySelector('.f-size').textContent = t('fRejected');
    fileTx.delete(d.id);
    const c = conns.get(pid);
    if (c && c.open) c.send({ t: 'file-reject', id: d.id });
  });
}

async function onFileAccept(pid, d) {
  const tx = fileTx.get(d.id);
  if (!tx || tx.dir !== 'out' || tx.pid !== pid) return;
  const c = conns.get(pid);
  if (!c || !c.open) return;
  const box = tx.lineEl;
  const prog = box.querySelector('.f-prog > div');
  const sizeEl = box.querySelector('.f-size');
  const total = tx.file.size;
  let sent = 0, seq = 0;
  while (sent < total) {
    if (tx.cancelled || !c.open) return;
    while (c.dataChannel && c.dataChannel.bufferedAmount > BUF_LIMIT) {
      await new Promise(r => setTimeout(r, 10));
      if (tx.cancelled || !c.open) return;
    }
    const end = Math.min(sent + CHUNK, total);
    // darabonként olvasunk, így óriási fájlnál sem fogy el a memória
    const part = await tx.file.slice(sent, end).arrayBuffer();
    c.send({ t: 'file-chunk', id: d.id, seq, last: end >= total, data: part });
    sent = end; seq++;
    const pct = Math.round(sent / total * 100);
    prog.style.width = pct + '%';
    sizeEl.textContent = fmtSize(total) + t('fSending') + pct + '%';
  }
  sizeEl.textContent = fmtSize(total) + t('fSent');
  fileTx.delete(d.id);
  pushHist(pid, { k: 's', x: '📄 ' + tx.file.name + ' (' + fmtSize(total) + ')' + t('fSent') });
}

function onFileChunk(pid, d) {
  const tx = fileTx.get(d.id);
  if (!tx || tx.dir !== 'in' || tx.pid !== pid || tx.cancelled) return;
  let bytes = d.data;
  if (bytes instanceof ArrayBuffer) bytes = new Uint8Array(bytes);
  if (!bytes) return;
  tx.got += bytes.byteLength || bytes.length || 0;
  if (tx.writable) {
    tx.wq = tx.wq.then(() => tx.writable.write(bytes)).catch(() => {});
  } else {
    tx.parts.push(bytes);
  }
  const prog = tx.lineEl.querySelector('.f-prog > div');
  const pct = tx.size ? Math.min(100, Math.round(tx.got / tx.size * 100)) : 100;
  prog.style.width = pct + '%';
  tx.lineEl.querySelector('.f-size').textContent = fmtSize(tx.size) + t('fRecv') + ' ' + pct + '%';
  if (d.last) {
    const sizeEl = tx.lineEl.querySelector('.f-size');
    if (tx.writable) {
      tx.wq.then(() => tx.writable.close()).then(() => {
        sizeEl.textContent = fmtSize(tx.got) + t('fSavedDisk');
      }).catch(() => {});
    } else {
      const blob = new Blob(tx.parts, { type: tx.mime || 'application/octet-stream' });
      const url = URL.createObjectURL(blob);
      sizeEl.innerHTML = fmtSize(blob.size) + t('fDone') + ' &nbsp;<a href="' + url + '" download="' +
        escHtml(tx.name) + '">' + t('fSave') + '</a>';
      if ((tx.mime || '').startsWith('image/')) {
        const img = document.createElement('img');
        img.className = 'thumb';
        img.src = url;
        img.title = t('imgWin');
        img.addEventListener('click', () => showImageWin(url, tx.name));
        tx.lineEl.appendChild(img);
      }
    }
    pushHist(pid, { k: 's', x: '📄 ' + tx.name + ' (' + fmtSize(tx.got) + ')' + t('fDone') });
    fileTx.delete(d.id);
    sndMsg();
  }
}

// ---------- eszközválasztó (mikrofon/kamera) ----------
async function showDevicePicker(kind) {
  // kind: 'voice' | 'webcam'
  // Megkérjük az engedélyt ha még nincs, hogy az eszközneveket lássuk
  try {
    const tmp = await navigator.mediaDevices.getUserMedia(
      kind === 'webcam' ? { video: true, audio: true } : { audio: true });
    tmp.getTracks().forEach(t => t.stop());
  } catch { /* ha nincs engedély, a lista üres lesz */ }

  const devices = await navigator.mediaDevices.enumerateDevices();
  const mics = devices.filter(d => d.kind === 'audioinput');
  const cams = kind === 'webcam' ? devices.filter(d => d.kind === 'videoinput') : [];

  // Ha csak 1 mikrofon és (webcamnál) 1 kamera van, nem kérdezünk
  if (mics.length <= 1 && cams.length <= 1) return { mic: null, cam: null };

  return new Promise(resolve => {
    const ov = el('div', 'modal-overlay');
    const dlg = el('div', 'picker-dialog');
    dlg.innerHTML = '<div class="picker-title">' + t('selectDevice') + '</div>';

    let selectedMic = preferredMic;
    let selectedCam = preferredCam;

    // Mikrofon választó
    if (mics.length > 0) {
      const lbl = el('div', 'picker-label', t('selectMic'));
      dlg.appendChild(lbl);
      const sel = document.createElement('select');
      sel.className = 'picker-select';
      mics.forEach((d, i) => {
        const opt = document.createElement('option');
        opt.value = d.deviceId;
        opt.textContent = d.label || (t('defaultDevice') + ' ' + (i + 1));
        if (d.deviceId === preferredMic) opt.selected = true;
        sel.appendChild(opt);
      });
      sel.addEventListener('change', () => { selectedMic = sel.value; });
      dlg.appendChild(sel);
    }

    // Kamera választó (csak webcamnál)
    if (cams.length > 0) {
      const lbl = el('div', 'picker-label', t('selectCam'));
      dlg.appendChild(lbl);
      const sel = document.createElement('select');
      sel.className = 'picker-select';
      cams.forEach((d, i) => {
        const opt = document.createElement('option');
        opt.value = d.deviceId;
        opt.textContent = d.label || (t('defaultDevice') + ' ' + (i + 1));
        if (d.deviceId === preferredCam) opt.selected = true;
        sel.appendChild(opt);
      });
      sel.addEventListener('change', () => { selectedCam = sel.value; });
      dlg.appendChild(sel);
    }

    const row = el('div', 'picker-row');
    const okBtn = el('button', 'xp-btn', 'OK');
    const cancelBtn = el('button', 'xp-btn', t('cancel'));
    row.appendChild(okBtn); row.appendChild(cancelBtn);
    dlg.appendChild(row);
    ov.appendChild(dlg);
    document.body.appendChild(ov);

    okBtn.addEventListener('click', () => {
      if (selectedMic) { preferredMic = selectedMic; localStorage.setItem('msn75_mic', selectedMic); }
      if (selectedCam) { preferredCam = selectedCam; localStorage.setItem('msn75_cam', selectedCam); }
      ov.remove();
      resolve({ mic: selectedMic, cam: selectedCam });
    });
    cancelBtn.addEventListener('click', () => { ov.remove(); resolve(null); });
  });
}

async function buildMediaConstraints(kind) {
  const pick = await showDevicePicker(kind);
  if (!pick) throw new Error('cancelled');
  const audio = pick.mic ? { deviceId: { exact: pick.mic } } : true;
  if (kind === 'webcam') {
    const video = pick.cam ? { deviceId: { exact: pick.cam } } : true;
    return { video, audio };
  }
  return { audio };
}

// ---------- hívások ----------
async function startCall(pid, kind) {
  const c = conns.get(pid);
  if (!c || !c.open) { sysMsg(pid, t('notAvailShort')); return; }
  if (calls.has(pid)) { sysMsg(pid, t('callBusy')); return; }
  let stream;
  try {
    const constraints = await buildMediaConstraints(kind);
    stream = await navigator.mediaDevices.getUserMedia(constraints);
  } catch {
    sysMsg(pid, kind === 'webcam' ? t('camDenied') : t('micDenied'));
    return;
  }
  const call = peer.call(conns.get(pid)?.peer || pid, stream, { metadata: { kind, name: me.name } });
  watchIce(call, pid);
  openCallWin(pid, kind, call, stream, true);
  sysMsg(pid, kind === 'webcam' ? t('callCamStarted') : t('callVoiceStarted'));
}

function handleIncomingCall(call) {
  const pid = baseOf(call.peer);
  const kind = call.metadata?.kind;
  if (kind === 'screen') return handleIncomingScreen(call);
  if (kind !== 'voice' && kind !== 'webcam') { try { call.close(); } catch {} return; }

  openChat(pid);
  const w = chatWins.get(pid);
  const ask = el('div', 'ask-box');
  const span = el('span');
  span.innerHTML = (kind === 'webcam' ? '📹 ' : '📞 ') +
    (kind === 'webcam' ? tf('callIncCam', escHtml(dispName(pid))) : tf('callIncVoice', escHtml(dispName(pid))));
  ask.appendChild(span);
  const row = el('div', 'row');
  const ok = el('button', 'xp-btn', t('accept'));
  const no = el('button', 'xp-btn', t('decline'));
  row.appendChild(ok); row.appendChild(no);
  ask.appendChild(row);
  $('.chat-toolbar', w.win).after(ask);

  let decided = false;
  sndRing();
  const ringTimer = setInterval(() => { if (!decided) sndRing(); }, 3500);
  const finish = () => { decided = true; clearInterval(ringTimer); ask.remove(); };

  ok.addEventListener('click', async () => {
    finish();
    let stream;
    try {
      const constraints = await buildMediaConstraints(kind);
      stream = await navigator.mediaDevices.getUserMedia(constraints);
    } catch {
      sysMsg(pid, t('callNoDev'));
      try { call.close(); } catch {}
      return;
    }
    // előbb az ablak (és vele a stream-figyelő), csak utána az answer
    openCallWin(pid, kind, call, stream, false);
    call.answer(stream);
    watchIce(call, pid);
  });
  no.addEventListener('click', () => { finish(); try { call.close(); } catch {} });
  setTimeout(() => { if (!decided) { finish(); try { call.close(); } catch {} } }, 45000);
}

function openCallWin(pid, kind, call, localStream, outgoing) {
  const win = el('div', 'win callwin');
  win.style.left = (Math.max(20, window.innerWidth / 2 - 230) + (cascade % 4) * 22) + 'px';
  win.style.top = (60 + (cascade % 4) * 22) + 'px';
  const iconImg = A ? '<img src="' + A.buddies + '" alt="">' : buddySvg(16, 'online');
  win.innerHTML =
    '<div class="titlebar">' +
      '<span class="t-icon">' + iconImg + '</span>' +
      '<span class="t-text">' + escHtml(dispName(pid)) + ' — ' + (kind === 'webcam' ? t('webcamCall') : t('voiceCall')) + '</span>' +
      '<span class="t-btns"><span class="tbtn close">✕</span></span>' +
    '</div>' +
    '<div class="win-body">' +
      '<div class="call-stage">' +
        (kind === 'webcam'
          ? '<video class="remote" autoplay playsinline></video><video class="self" autoplay playsinline muted></video>'
          : '<div class="voice-face"><div class="dp dp-64">' + dpHtml(pid) + '</div>' +
            '<div>' + escHtml(dispName(pid)) + '</div><div class="callstate">' +
            (outgoing ? t('calling') : t('connectingCall')) + '</div></div>') +
      '</div>' +
      '<div class="call-bar">' +
        '<span class="timer">0:00</span>' +
        '<button class="mute">' + t('muteMic') + '</button>' +
        '<button class="cunmute" style="display:none">' + t('unmute') + '</button>' +
        '<button class="hang">' + t('hangUp') + '</button>' +
      '</div>' +
    '</div>';
  document.body.appendChild(win);
  makeDraggable(win, $('.titlebar', win));
  bringToFront(win);
  addMobileBack(win);
  mobileShow(win);

  // Minden hívásnak saját, egyedi állapota van — a bezárás mindig
  // pontosan ezt az ablakot zárja, sosem egy másikét.
  const state = { kind, call, win, localStream, secs: 0, timer: null, done: false };
  if (!calls.has(pid)) calls.set(pid, state);

  const closeThis = () => endCallState(pid, state);

  if (kind === 'webcam') $('.self', win).srcObject = localStream;

  call.on('stream', rs => {
    const unmuteBtn = $('.cunmute', win);
    if (kind === 'webcam') {
      const v = $('.remote', win);
      v.srcObject = rs;
      // Autoplay-védelem: ha hangosan nem indulhat, némán indítjuk,
      // és a Hang bekapcsolása gombbal jön vissza a hang.
      v.play().catch(() => {
        v.muted = true;
        v.play().catch(() => {});
        unmuteBtn.style.display = 'inline-block';
        unmuteBtn.addEventListener('click', () => {
          v.muted = false;
          v.play().catch(() => {});
          unmuteBtn.style.display = 'none';
        });
      });
    } else {
      const a = document.createElement('audio');
      a.autoplay = true;
      a.srcObject = rs;
      win.appendChild(a);
      a.play().catch(() => {
        unmuteBtn.style.display = 'inline-block';
        unmuteBtn.addEventListener('click', () => {
          a.play().catch(() => {});
          unmuteBtn.style.display = 'none';
        });
      });
      const cs = $('.callstate', win);
      if (cs) cs.textContent = t('inCall');
    }
    if (!state.timer) {
      state.timer = setInterval(() => {
        state.secs++;
        const m = Math.floor(state.secs / 60), s = state.secs % 60;
        $('.timer', win).textContent = m + ':' + String(s).padStart(2, '0');
      }, 1000);
    }
  });
  call.on('close', closeThis);
  call.on('error', closeThis);

  $('.mute', win).addEventListener('click', e => {
    const tr = localStream.getAudioTracks()[0];
    if (!tr) return;
    tr.enabled = !tr.enabled;
    e.currentTarget.textContent = tr.enabled ? t('muteMic') : t('unmuteMic');
    e.currentTarget.classList.toggle('mute-on', !tr.enabled);
  });
  $('.hang', win).addEventListener('click', closeThis);
  $('.tbtn.close', win).addEventListener('click', e => { e.stopPropagation(); closeThis(); });
}

function endCallState(pid, st) {
  if (st.done) return;
  st.done = true;
  if (calls.get(pid) === st) calls.delete(pid);
  try { st.call.close(); } catch {}
  try { st.localStream.getTracks().forEach(tk => tk.stop()); } catch {}
  clearInterval(st.timer);
  st.win.remove();
  if (chatWins.has(pid)) sysMsg(pid, t('callEnded'));
}

// ICE-kapcsolat figyelése: ha nem jön létre a médiaút, szólunk
function watchIce(call, pid) {
  setTimeout(() => {
    const pc = call.peerConnection;
    if (!pc) return;
    pc.addEventListener('iceconnectionstatechange', () => {
      if (pc.iceConnectionState === 'failed') {
        sysMsg(pid, t('streamFailed'));
      }
    });
  }, 0);
}

// ---------- képernyő-stream ----------
const STREAM_PROFILES = {
  high:  { width: { ideal: 1920 }, height: { ideal: 1080 }, frameRate: { ideal: 30, max: 60 }, cursor: 'always' },
  mid:   { width: { max: 1280 }, height: { max: 720 },  frameRate: { ideal: 20, max: 30 }, cursor: 'always' },
  low:   { width: { max: 854 },  height: { max: 480 },  frameRate: { ideal: 15, max: 20 }, cursor: 'always' },
};

function showStreamQualityPicker() {
  return new Promise(resolve => {
    const ov = el('div', 'modal-overlay');
    const dlg = el('div', 'picker-dialog');
    dlg.innerHTML = '<div class="picker-title">' + t('streamQTitle') + '</div>';

    // Minőség-címke
    const qlbl = el('div', 'picker-label', '🎞️ Minőség / Quality');
    dlg.appendChild(qlbl);

    const opts = [
      { key: 'high', label: t('streamQHigh') },
      { key: 'mid',  label: t('streamQMid') },
      { key: 'low',  label: t('streamQLow') },
    ];
    let selectedQ = preferredStreamQ;
    const qBtns = [];
    opts.forEach(o => {
      const btn = el('button', 'picker-opt' + (preferredStreamQ === o.key ? ' selected' : ''), o.label);
      btn.addEventListener('click', () => {
        selectedQ = o.key;
        qBtns.forEach(b => b.classList.remove('selected'));
        btn.classList.add('selected');
      });
      dlg.appendChild(btn);
      qBtns.push(btn);
    });

    // Hang-címke
    const albl = el('div', 'picker-label', '🔊 Hang / Audio');
    dlg.appendChild(albl);

    let withAudio = preferredStreamQ !== 'noaudio';
    const audBtns = [];
    [{ key: true, label: t('streamWithAudio') }, { key: false, label: t('streamNoAudio') }].forEach(o => {
      const btn = el('button', 'picker-opt' + (withAudio === o.key ? ' selected' : ''), o.label);
      btn.addEventListener('click', () => {
        withAudio = o.key;
        audBtns.forEach(b => b.classList.remove('selected'));
        btn.classList.add('selected');
      });
      dlg.appendChild(btn);
      audBtns.push(btn);
    });

    const row = el('div', 'picker-row');
    const okBtn = el('button', 'xp-btn', '▶ Streamelés indítása');
    const cancelBtn = el('button', 'xp-btn', t('cancel'));
    row.appendChild(okBtn); row.appendChild(cancelBtn);
    dlg.appendChild(row);
    ov.appendChild(dlg);
    document.body.appendChild(ov);

    okBtn.addEventListener('click', () => {
      preferredStreamQ = selectedQ;
      localStorage.setItem('msn75_streamq', selectedQ);
      ov.remove();
      resolve({ quality: selectedQ, audio: withAudio });
    });
    cancelBtn.addEventListener('click', () => { ov.remove(); resolve(null); });
  });
}

async function startStream(pid) {
  const c = conns.get(pid);
  if (!c || !c.open) { sysMsg(pid, t('streamCantStart')); return; }
  if (outCalls.has(pid)) { sysMsg(pid, t('streamAlready')); return; }

  // Minőség + hang-választó megjelenítése
  const pick = await showStreamQualityPicker();
  if (!pick) return; // felhasználó elutasította
  const { quality, audio: wantAudio } = pick;

  try {
    const vt = screenStream ? screenStream.getVideoTracks()[0] : null;
    if (!screenStream || !screenStream.active || !vt || vt.readyState !== 'live') {
      const profile = STREAM_PROFILES[quality] || STREAM_PROFILES.high;
      if (wantAudio) {
        try {
          screenStream = await navigator.mediaDevices.getDisplayMedia({
            video: profile,
            audio: {
              echoCancellation: false,
              noiseSuppression: false,
              autoGainControl: false,
              suppressLocalAudioPlayback: false
            }
          });
        } catch {
          try {
            screenStream = await navigator.mediaDevices.getDisplayMedia({
              video: profile,
              audio: true
            });
          } catch {
            screenStream = await navigator.mediaDevices.getDisplayMedia({
              video: profile,
              audio: false
            });
          }
        }
      } else {
        screenStream = await navigator.mediaDevices.getDisplayMedia({
          video: profile,
          audio: false
        });
      }
      const vTrack = screenStream.getVideoTracks()[0];
      if (vTrack) {
        if ('contentHint' in vTrack) vTrack.contentHint = 'motion';
        vTrack.addEventListener('ended', () => {
          for (const id of [...outCalls.keys()]) stopStream(id);
          screenStream = null;
        });
      }
    }
  } catch {
    sysMsg(pid, t('streamDenied'));
    return;
  }
  placeStreamCall(pid);
  sysMsg(pid, t('streamStarted'));
}

// a stream-hívás tényleges felépítése (első indításkor és újrapróbáláskor)
function placeStreamCall(pid) {
  if (!screenStream || !screenStream.active) return;
  const old = outCalls.get(pid);
  if (old) { try { old.close(); } catch {} }

  // Közvetlenül az aktív screenStream-et adjuk át a peer.call-nak
  const call = peer.call(conns.get(pid)?.peer || pid, screenStream, { metadata: { kind: 'screen', name: me.name } });
  watchIce(call, pid);
  outCalls.set(pid, call);
  const w = chatWins.get(pid);
  if (w) {
    w.sbar.classList.add('on');
    const b = $('.tb-big[data-act="stream"]', w.win);
    if (b) b.classList.add('active');
  }
  call.on('close', () => { if (outCalls.get(pid) === call) cleanupOutCall(pid); });
  call.on('error', () => { if (outCalls.get(pid) === call) cleanupOutCall(pid); });

  // Kulcsképkocka kérése a WebRTC kódolótól a csatlakozáskor
  setTimeout(() => forceKeyFrame(call), 300);
  setTimeout(() => forceKeyFrame(call), 800);
  setTimeout(() => forceKeyFrame(call), 1500);
  setTimeout(() => forceKeyFrame(call), 3000);
}

async function forceKeyFrame(call) {
  if (!call) return;
  try {
    const pc = call.peerConnection;
    if (!pc || !pc.getSenders) return;
    const vSender = pc.getSenders().find(s => s.track && s.track.kind === 'video');
    if (vSender && typeof vSender.generateKeyFrame === 'function') {
      try { await vSender.generateKeyFrame(); } catch (e) {}
    }
  } catch {}
}

function stopStream(pid, silent) {
  const call = outCalls.get(pid);
  if (!call && silent) return;
  if (call) { try { call.close(); } catch {} }
  const c = conns.get(pid);
  if (c && c.open) c.send({ t: 'stream-stop' });
  cleanupOutCall(pid);
  if (outCalls.size === 0 && screenStream) {
    screenStream.getTracks().forEach(tk => tk.stop());
    screenStream = null;
  }
  if (!silent) sysMsg(pid, t('streamStopped'));
}

function cleanupOutCall(pid) {
  outCalls.delete(pid);
  const w = chatWins.get(pid);
  if (w) {
    w.sbar.classList.remove('on');
    const b = $('.tb-big[data-act="stream"]', w.win);
    if (b) b.classList.remove('active');
  }
}

function handleIncomingScreen(call) {
  const pid = baseOf(call.peer);
  openChat(pid);
  const w = chatWins.get(pid);

  let remoteStream = null;
  let decided = false;

  // FONTOS: Az eseményfigyelőket azonos ponton kötjük be, nehogy lemaradjunk a médiafolyamról.
  call.on('stream', stream => {
    remoteStream = stream;
    if (decided) {
      showViewer(pid, stream);
    }
  });
  call.on('close', () => closeViewer(pid));
  call.on('error', () => closeViewer(pid));

  // Biztonsági bekötés az underlying PeerConnection-höz
  if (call.peerConnection) {
    call.peerConnection.addEventListener('track', event => {
      if (event.streams && event.streams[0]) {
        remoteStream = event.streams[0];
        if (decided && viewers.has(pid)) {
          const v = viewers.get(pid);
          if (v && v.win) {
            const vid = v.win.querySelector('video');
            if (vid && vid.srcObject !== remoteStream) {
              vid.srcObject = remoteStream;
              vid.play().catch(() => {});
            }
          }
        }
      }
    });
  }

  const ask = el('div', 'ask-box');
  const ic = A ? '<span class="emo" style="background-position:-' + (63 * 19) + 'px 0"></span> ' : '🖥️ ';
  const span = el('span');
  span.innerHTML = ic + tf('streamAsk', escHtml(dispName(pid)));
  ask.appendChild(span);
  const row = el('div', 'row');
  const ok = el('button', 'xp-btn', t('accept'));
  const no = el('button', 'xp-btn', t('decline'));
  row.appendChild(ok); row.appendChild(no);
  ask.appendChild(row);
  $('.chat-toolbar', w.win).after(ask);
  sndRing();

  ok.addEventListener('click', () => {
    decided = true; ask.remove();
    call.answer();
    watchIce(call, pid);
    if (remoteStream) {
      showViewer(pid, remoteStream);
    } else {
      setTimeout(() => {
        if (!viewers.has(pid)) {
          const c = conns.get(pid);
          if (c && c.open) c.send({ t: 'stream-retry' });
          sysMsg(pid, t('streamWaiting'));
        }
      }, 8000);
    }
  });
  no.addEventListener('click', () => { decided = true; ask.remove(); try { call.close(); } catch {} });
  setTimeout(() => { if (!decided) { ask.remove(); try { call.close(); } catch {} } }, 45000);
}

function showViewer(pid, stream) {
  // Ha már nyitva van a nézőablak ehhez a partnerhez (pl. a 2. track érkezésekor),
  // NEM szabad bezárni vagy a trackeket leállítani — csak frissítjük a streamet!
  if (viewers.has(pid)) {
    const v = viewers.get(pid);
    v.stream = stream;
    const video = v.win.querySelector('video');
    if (video) {
      if (video.srcObject !== stream) video.srcObject = stream;
      video.play().catch(() => {});
    }
    if (v.checkAudioTracks) v.checkAudioTracks();
    return;
  }

  const win = el('div', 'win viewerwin');
  win.style.left = (Math.max(20, window.innerWidth / 2 - 320) + (cascade % 4) * 20) + 'px';
  win.style.top = (50 + (cascade % 4) * 20) + 'px';

  const iconImg = A ? '<img src="' + A.buddies + '" alt="">' : buddySvg(16, 'online');
  win.innerHTML =
    '<div class="titlebar">' +
      '<span class="t-icon">' + iconImg + '</span>' +
      '<span class="t-text">' + escHtml(dispName(pid)) + ' — ' + t('streamWin') + '</span>' +
      '<span class="t-btns"><span class="tbtn close">✕</span></span>' +
    '</div>' +
    '<div class="win-body">' +
      '<div class="viewer-bar"><span class="live">' + t('streamLive') + '</span>' +
      '<span>' + tf('streamOf', escHtml(dispName(pid))) + '</span>' +
      '<span class="vstate">' + t('streamConnecting') + '</span>' +
      '<button class="vretry" title="' + t('streamRetry') + '">' + t('streamRetry') + '</button>' +
      '<button class="vunmute">' + t('unmute') + '</button>' +
      '<button class="vfull">' + t('fullscreen') + '</button></div>' +
    '</div>';

  const video = document.createElement('video');
  video.autoplay = true;
  video.playsInline = true;
  video.muted = true; // Kezdetben némítva: garantálja az azonnali videó-lejátszást autoplay-tiltás nélkül
  video.setAttribute('playsinline', '');
  video.setAttribute('webkit-playsinline', '');
  video.srcObject = stream;
  $('.win-body', win).appendChild(video);

  document.body.appendChild(win);
  makeDraggable(win, $('.titlebar', win));
  bringToFront(win);
  addMobileBack(win);
  mobileShow(win);

  const vstate = $('.vstate', win);
  const unmuteBtn = $('.vunmute', win);
  const retryBtn = $('.vretry', win);

  const checkAudioTracks = () => {
    const hasAudio = stream.getAudioTracks().length > 0;
    if (hasAudio) {
      unmuteBtn.style.display = 'inline-block';
      unmuteBtn.textContent = video.muted ? t('unmute') : ('🔇 ' + (lang === 'hu' ? 'Némítás' : 'Mute'));
    } else {
      unmuteBtn.style.display = 'none';
    }
  };

  checkAudioTracks();
  stream.addEventListener('addtrack', () => {
    checkAudioTracks();
    playVideo();
  });
  stream.addEventListener('removetrack', checkAudioTracks);

  const updateStats = () => {
    if (video.videoWidth > 0 && video.videoHeight > 0) {
      vstate.textContent = video.videoWidth + 'x' + video.videoHeight;
      vstate.style.color = '#7ec87e';
    } else {
      vstate.textContent = t('streamConnecting');
      vstate.style.color = '#8fa8c0';
    }
  };

  const playVideo = () => {
    if (video.srcObject !== stream) video.srcObject = stream;
    video.play().then(updateStats).catch(() => {
      video.muted = true;
      video.play().then(updateStats).catch(() => {});
    });
  };

  playVideo();
  video.onloadedmetadata = playVideo;
  video.oncanplay = playVideo;
  video.addEventListener('playing', updateStats);
  video.addEventListener('resize', updateStats);
  video.addEventListener('pause', () => { if (stream.active) playVideo(); });

  // Időszakos kulcsképkocka kérés a küldőtől, amíg nincs videó kép (videoWidth === 0)
  let kfInterval = setInterval(() => {
    if (!viewers.has(pid)) {
      clearInterval(kfInterval);
      return;
    }
    if (video.videoWidth === 0) {
      const c = conns.get(pid);
      if (c && c.open) c.send({ t: 'stream-keyframe' });
    } else {
      clearInterval(kfInterval);
      updateStats();
    }
  }, 1000);

  unmuteBtn.addEventListener('click', () => {
    if (video.muted) {
      video.muted = false;
      video.volume = 1.0;
      video.play().catch(() => {});
    } else {
      video.muted = true;
    }
    checkAudioTracks();
  });

  const requestRetry = () => {
    vstate.textContent = t('streamConnecting');
    vstate.style.color = '#8fa8c0';
    playVideo();
    const c = conns.get(pid);
    if (c && c.open) c.send({ t: 'stream-retry' });
  };

  retryBtn.addEventListener('click', requestRetry);

  const videoTrack = stream.getVideoTracks()[0];
  if (videoTrack) {
    videoTrack.addEventListener('mute', () => {
      vstate.textContent = t('streamPaused');
      vstate.style.color = '#f5c056';
    });
    videoTrack.addEventListener('unmute', () => {
      vstate.textContent = '';
      if (video.srcObject !== stream) video.srcObject = stream;
      playVideo();
    });
    videoTrack.addEventListener('ended', () => closeViewer(pid));
  }

  $('.vfull', win).addEventListener('click', () => video.requestFullscreen?.());
  $('.tbtn.close', win).addEventListener('click', e => { e.stopPropagation(); closeViewer(pid); });

  viewers.set(pid, { win, stream, kfInterval, checkAudioTracks });
  sysMsg(pid, tf('streamGot', dispName(pid)));
  bringToFront(win);
  mobileShow(win);
  win.focus?.();
}

function closeViewer(pid) {
  const v = viewers.get(pid);
  if (!v) return;
  if (v.kfInterval) clearInterval(v.kfInterval);
  v.win.remove();
  viewers.delete(pid);
}

// ---------- verzió és frissítés-ellenőrzés ----------

function cmpVer(a, b) {
  const pa = String(a).split('.').map(n => parseInt(n, 10) || 0);
  const pb = String(b).split('.').map(n => parseInt(n, 10) || 0);
  for (let i = 0; i < 3; i++) {
    if ((pa[i] || 0) > (pb[i] || 0)) return 1;
    if ((pa[i] || 0) < (pb[i] || 0)) return -1;
  }
  return 0;
}

// Halkan megnézi, van-e újabb kiadás. Hiba esetén csendben marad —
// a program offline is teljesen működik.
// A verzió-adatot <script> elemmel töltjük be, nem fetch-csel: így
// file:// alól (asztali alkalmazás) és a WebView-ból is működik, ahol a
// fetch CORS miatt elbukna.
function loadLatestInfo() {
  return new Promise((res, rej) => {
    const sc = document.createElement('script');
    sc.src = VERSION_JS_URL + '?t=' + Date.now();
    sc.onload = () => {
      sc.remove();
      const d = window.__msnLatest;
      if (d && typeof d === 'object') res(d);
      else rej(new Error('nincs adat'));
    };
    sc.onerror = () => { sc.remove(); rej(new Error('nem toltodott be')); };
    document.head.appendChild(sc);
    setTimeout(() => rej(new Error('idotullepes')), 12000);
  });
}

async function checkUpdate(manual) {
  try {
    const d = await loadLatestInfo();
    const latest = String(d.version || '');
    if (!/^\d+(\.\d+){0,2}$/.test(latest)) throw new Error('bad');
    const url = typeof d.url === 'string' && d.url.startsWith('https://') ? d.url : null;
    if (cmpVer(latest, APP_VERSION) <= 0) {
      if (manual) alert(tf('upToDate', APP_VERSION));
      return;
    }
    // kézi keresésnél a korábbi "elrejtés" ne némítson el
    if (manual) localStorage.removeItem('msn75_skipver');
    if (localStorage.getItem('msn75_skipver') === latest) return;
    showUpdateBar(latest, url);
    if (manual) alert(tf('updateFound', latest));
  } catch {
    // hálózati hiba: automatikus keresésnél csendben maradunk
    if (manual) alert(t('updateCheckFailed'));
  }
}

function showUpdateBar(latest, url) {
  if ($('#updateBar')) return;
  // bejelentkezés előtt a belépő ablakban, utána a főablak alján
  const loggedIn = $('#mainWin').style.display === 'flex';
  const foot = loggedIn ? $('.main-foot') : $('.login-foot');
  if (!foot) return;
  const bar = el('div', 'update-bar');
  bar.id = 'updateBar';
  const txt = el('span', 'ub-text', tf('updateAvail', latest));
  bar.appendChild(txt);

  // egy gombbal frissíthető
  const btn = el('button', 'xp-btn ub-btn', t('updateNow'));
  btn.addEventListener('click', () => {
    btn.disabled = true;
    btn.textContent = t('updating');
    doUpdate(url, latest);
  });
  bar.appendChild(btn);
  const x = el('span', 'ub-x', '✕');
  x.title = t('updateHide');
  x.addEventListener('click', () => {
    localStorage.setItem('msn75_skipver', latest);
    bar.remove();
  });
  bar.appendChild(x);
  foot.before(bar);
}

// ---------- beszélgetés mentése és tárolt adatok ürítése ----------
function exportChatTxt(pid) {
  const hist = loadHist(pid);
  const lines = [];
  lines.push('MSN Messenger 7.5 — P2P');
  lines.push(t('convTitle') + ': ' + dispName(pid) + ' <' + pid + '>');
  lines.push(new Date().toLocaleString());
  lines.push('-'.repeat(50));
  for (const en of hist) {
    if (en.k === 'm') lines.push('[' + (en.ts || '') + '] ' + en.n + ': ' + en.x);
    else lines.push('* ' + en.x);
  }
  const blob = new Blob([lines.join(String.fromCharCode(13, 10))], { type: 'text/plain;charset=utf-8' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'beszelgetes-' + pid + '.txt';
  a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 4000);
}

// az összes beszélgetés-előzmény törlése (csak a saját fiókban)
function clearAllHistory() {
  if (!confirm(t('confirmClearMsgs'))) return;
  const pre = 'msn75_hist_' + me.id + '_';
  const preBase = 'msn75_hist_' + me.baseId + '_';
  for (const k of Object.keys(localStorage)) {
    if (k.startsWith(pre) || k.startsWith(preBase)) localStorage.removeItem(k);
  }
  for (const [pid, w] of chatWins) {
    w.msgs.innerHTML = '';
    w.lastMsgAt = null;
  }
  alert(t('doneCleared'));
}

// a beszélgetésekben megjelenített képek/videók elengedése
function clearAllMedia() {
  if (!confirm(t('confirmClearMedia'))) return;
  let n = 0;
  for (const [, w] of chatWins) {
    w.win.querySelectorAll('.img-msg, .vid-msg').forEach(node => {
      node.querySelectorAll('img, video, a').forEach(el2 => {
        const u = el2.src || el2.href;
        if (u && u.startsWith('blob:')) { try { URL.revokeObjectURL(u); } catch {} }
      });
      const msg = node.closest('.msg');
      (msg || node).remove();
      n++;
    });
  }
  // az előzményekből is kivesszük a média-bejegyzéseket
  const pres = ['msn75_hist_' + me.id + '_', 'msn75_hist_' + me.baseId + '_'];
  for (const k of Object.keys(localStorage)) {
    if (!pres.some(pr => k.startsWith(pr))) continue;
    try {
      const arr = JSON.parse(localStorage.getItem(k) || '[]')
        .filter(e => !(e.k === 's' && /^(🖼️|🎬|📄|🎤)/.test(String(e.x || ''))));
      localStorage.setItem(k, JSON.stringify(arr));
    } catch {}
  }
  alert(tf('mediaCleared', n));
}

// Frissítés egy gombbal:
//  - böngészőben: gyorsítótár ürítése és újratöltés
//  - Android appban: az új APK letöltése (telepítést a rendszer kezeli)
async function doUpdate(url, latest) {
  const isApp = location.hostname === 'appassets.androidplatform.net';
  if (isApp) {
    const apk = 'https://sid14925.github.io/msn75-p2p/MSN75-P2P.apk';
    window.open(apk, '_blank');
    return;
  }
  try {
    if (window.caches && caches.keys) {
      const keys = await caches.keys();
      await Promise.all(keys.map(k => caches.delete(k)));
    }
  } catch { /* nem érhető el — a query paraméter így is friss példányt hoz */ }
  const base = location.origin + location.pathname;
  location.replace(base + '?v=' + encodeURIComponent(latest) + '&t=' + Date.now());
}

// ---------- kilépés ----------
function signOut() {
  try { broadcast({ t: 'bye' }); } catch {}
  for (const c of conns.values()) { try { c.close(); } catch {} }
  conns.clear();
  try { peer?.destroy(); } catch {}
}
// az Android alkalmazás bezáráskor ezt hívja
window.msnSignOut = signOut;

addEventListener('beforeunload', signOut);
addEventListener('pagehide', signOut);

makeDraggable($('#loginWin'), $('#loginWin .titlebar'));
makeDraggable($('#mainWin'), $('#mainWin .titlebar'));

if (typeof window !== 'undefined' && typeof MutationObserver !== 'undefined') {
  const winObserver = new MutationObserver((mutations) => {
    let changed = false;
    for (const m of mutations) {
      for (const node of m.addedNodes) {
        if (node.nodeType === 1 && node.classList && node.classList.contains('win')) changed = true;
      }
      for (const node of m.removedNodes) {
        if (node.nodeType === 1 && node.classList && node.classList.contains('win')) changed = true;
      }
    }
    if (changed) updateTaskbar();
  });
  winObserver.observe(document.body, { childList: true, subtree: true });
}
