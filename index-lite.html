<!DOCTYPE html>
<html lang="hu">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MSN Messenger 7.5 — P2P (Escargot)</title>
<style>
/* ===== MSN Messenger 7.5 — P2P kiadás | hű MSN 7.5 / Windows XP kinézet ===== */

* { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --emo: none;
  --line: #a9c4e4;
  --panel: #ebf3fb;
  --deep: #1a3e6e;
  --link: #3b5a82;
  --win-col: #1557d0;
  --win-border: #0831D9;
}

html, body {
  width: 100%; height: 100%;
  font-family: Tahoma, "Segoe UI", Verdana, sans-serif;
  font-size: 11px;
  background: linear-gradient(135deg, #4a8ad4 0%, #2a5da8 60%, #1e4b8f 100%);
  overflow: hidden;
  user-select: none;
}

/* ---------- XP Luna ablak ---------- */
.win {
  position: absolute;
  background: #ECE9D8;
  border: 1px solid var(--win-border);
  border-radius: 8px 8px 4px 4px;
  box-shadow: 2px 4px 16px rgba(0,0,0,.45);
  display: flex;
  flex-direction: column;
  min-width: 240px;
}
.titlebar {
  height: 26px;
  border-radius: 7px 7px 0 0;
  background: linear-gradient(180deg,
    color-mix(in srgb, var(--win-col) 45%, #ffffff) 0%,
    color-mix(in srgb, var(--win-col) 80%, #ffffff) 8%,
    var(--win-col) 40%,
    color-mix(in srgb, var(--win-col) 88%, #ffffff) 85%,
    color-mix(in srgb, var(--win-col) 62%, #000000) 100%);
  color: #fff;
  font-weight: bold;
  font-size: 12px;
  display: flex;
  align-items: center;
  padding: 0 6px 0 8px;
  cursor: default;
  text-shadow: 1px 1px 1px rgba(0,0,0,.5);
  flex: 0 0 auto;
}
.titlebar .t-icon { margin-right: 5px; display: flex; align-items: center; }
.titlebar .t-icon img { width: 16px; height: 16px; }
.titlebar .t-text { flex: 1; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
.titlebar .t-btns { display: flex; gap: 3px; }
.tbtn {
  width: 20px; height: 20px;
  border: 1px solid #fff;
  border-radius: 3px;
  color: #fff;
  font-size: 11px;
  font-weight: bold;
  line-height: 18px;
  text-align: center;
  cursor: pointer;
  background: linear-gradient(180deg, #7ab1f5, #2a70e0);
}
.tbtn:hover { filter: brightness(1.15); }
.tbtn.close { background: linear-gradient(180deg, #f2a08b, #d5431f 45%, #b32b0a); }

.win-body {
  flex: 1;
  display: flex;
  flex-direction: column;
  overflow: hidden;
  border-radius: 0 0 3px 3px;
}

.xp-btn {
  min-width: 88px;
  height: 23px;
  padding: 0 12px;
  border: 1px solid #003c74;
  border-radius: 3px;
  background: linear-gradient(180deg, #ffffff 0%, #ecebe5 86%, #d8d0c4 100%);
  font-family: inherit;
  font-size: 11px;
  cursor: pointer;
}
.xp-btn:hover { box-shadow: inset 0 0 0 1px #ffc73c; }
.xp-btn:active { background: linear-gradient(180deg, #d8d0c4, #ecebe5); }
.xp-btn.primary { font-weight: bold; }
.xp-btn:disabled { color: #999; cursor: default; box-shadow: none; }

/* ---------- menüsor (fő- és csevegőablak) ---------- */
.menubar {
  display: flex;
  background: #f4f8fc;
  border-bottom: 1px solid #d9e6f2;
  padding: 1px 4px;
  position: relative;
  flex: 0 0 auto;
}
.menubar .m-item { padding: 3px 8px; cursor: default; color: #222; }
.menubar .m-item:hover, .menubar .m-item.open { background: #dcecfb; color: #000; }
.menu-pop {
  position: absolute;
  top: 22px;
  background: #fff;
  border: 1px solid #8ab1d8;
  box-shadow: 2px 2px 6px rgba(0,0,0,.25);
  min-width: 190px;
  z-index: 500;
  display: none;
  padding: 2px;
}
.menu-pop .mp-item { padding: 4px 18px 4px 22px; cursor: default; white-space: nowrap; }
.menu-pop .mp-item:hover { background: #dcecfb; }
.menu-pop .mp-item.dis { color: #a0a0a0; }
.menu-pop .mp-item.checked::before { content: '✔ '; margin-left: -14px; }
.menu-pop .mp-sep { border-top: 1px solid #dbe6f0; margin: 2px 4px; }

/* ---------- Bejelentkező ablak ---------- */
#loginWin { width: 356px; left: 50%; top: 50%; transform: translate(-50%, -52%); }
#loginWin .win-body { background: #fff; align-items: center; }
.login-top {
  width: 100%;
  padding: 16px 0 8px;
  display: flex;
  flex-direction: column;
  align-items: center;
  background: linear-gradient(180deg, #ffffff 0%, #f2f8fe 100%);
}
.login-top img.bfly { width: 90px; height: auto; }
.login-top .logo-fallback { font-size: 26px; }
.login-brand { font-size: 17px; color: #4d6e9b; margin-top: 4px; letter-spacing: .2px; }
.login-brand b { color: #24466f; }
.login-form { width: 100%; padding: 8px 34px 6px; }
.fld { width: 100%; margin-bottom: 8px; }
.fld label { display: block; color: #333; margin-bottom: 3px; }
.fld input, .fld select {
  width: 100%;
  height: 22px;
  border: 1px solid #7f9db9;
  border-radius: 0;
  padding: 0 5px;
  font-family: inherit;
  font-size: 11px;
  background: #fff;
}
.fld .hint { color: #808f9f; margin-top: 2px; font-size: 10px; }
.chk-row { display: flex; align-items: center; gap: 5px; margin: 2px 0 10px; color: #333; }
.login-btn-row { text-align: center; margin-bottom: 8px; }
#loginErr { color: #c00; min-height: 14px; text-align: center; padding: 0 20px; }
#loginStatus { color: #4a71a3; min-height: 15px; text-align: center; }
.login-foot {
  width: 100%;
  margin-top: 8px;
  border-top: 1px solid #d6e2ee;
  background: linear-gradient(180deg, #eef5fc, #d8e8f7);
  padding: 7px 12px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  color: #5b7ba0;
  font-size: 10px;
}
.login-foot img { height: 18px; }

/* ---------- Fő ablak ---------- */
#mainWin {
  width: 300px;
  height: 640px;
  max-height: calc(100vh - 20px);
  left: 22px; top: 10px;
  display: none;
}
#mainWin .win-body { background: #fff; }

.brand-band {
  display: flex;
  align-items: center;
  gap: 4px;
  padding: 3px 8px;
  background: linear-gradient(180deg, #ffffff, #eef5fc);
  border-bottom: 1px solid #e2edf7;
}
.brand-band .expander {
  color: #7fa8d0;
  border: 1px solid #c3d6e8;
  border-radius: 50%;
  width: 15px; height: 15px;
  font-size: 9px;
  line-height: 13px;
  text-align: center;
  background: #fff;
}
.brand-band img { width: 18px; height: auto; }
.brand-text { font-size: 13px; color: #4d6e9b; }
.brand-text b { color: #1a3e6e; }
.brand-b2 { margin-left: 3px; color: #3b5a82; }

.main-head {
  background:
    radial-gradient(120% 90% at 100% 0%, rgba(255,255,255,.85) 0%, rgba(255,255,255,0) 45%),
    linear-gradient(180deg, #fdfeff 0%, #e2eefa 55%, #cfe2f5 100%);
  border-bottom: 1px solid var(--line);
  padding: 8px 10px 6px;
  display: flex;
  gap: 9px;
}
.dp {
  border: 1px solid #98b7d8;
  background: #fff;
  padding: 2px;
  box-shadow: 1px 1px 3px rgba(70,110,160,.35);
  flex: 0 0 auto;
  display: flex; align-items: center; justify-content: center;
}
.dp img, .dp svg { display: block; }
.dp-48 { width: 52px; height: 52px; }
.dp-48 img, .dp-48 svg { width: 46px; height: 46px; object-fit: cover; }
.me-info { flex: 1; min-width: 0; padding-top: 2px; }
.me-line { display: flex; align-items: center; gap: 3px; cursor: pointer; max-width: 185px; }
.me-line:hover { text-decoration: underline; text-decoration-color: #4a71a3; }
.me-name { font-weight: bold; font-size: 12px; color: #24466f; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.me-st { color: #4a71a3; white-space: nowrap; }
.me-line .drop { color: #4a71a3; font-size: 9px; }
.me-status-sel { display: none; margin-top: 2px; font-family: inherit; font-size: 11px; max-width: 170px; }
.pm-line {
  margin-top: 3px;
  color: #7a8ba0;
  font-style: italic;
  border: 1px solid transparent;
  padding: 1px 2px;
  max-width: 190px;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  cursor: text;
}
.pm-line:hover { border-color: #b5cbe4; background: #fff; }
.pm-input {
  margin-top: 3px;
  width: 190px;
  height: 18px;
  font-family: inherit; font-size: 11px; font-style: italic;
  border: 1px solid #7f9db9;
  padding: 0 2px;
  display: none;
}
.me-id-line {
  margin-top: 3px;
  color: #6688aa; font-size: 10px;
  display: flex; align-items: center; gap: 4px;
  white-space: nowrap;
}
.me-id-line b { overflow: hidden; text-overflow: ellipsis; max-width: 120px; }
.copy-btn {
  border: 1px solid #8ab1d8; border-radius: 2px; background: #eaf4fd;
  font-size: 9px; cursor: pointer; padding: 0 4px; height: 14px;
  flex: 0 0 auto; font-family: inherit;
}
.copy-btn:hover { background: #d5e9fb; }

.today-row {
  display: flex;
  align-items: center;
  gap: 5px;
  padding: 3px 10px;
  background: linear-gradient(180deg, #eef5fc, #dfecf9);
  border-bottom: 1px solid #cbdcee;
}
.today-row img { width: 14px; height: auto; }
.today-row svg { width: 14px; height: 14px; }
.today-link { color: #1a3e6e; font-weight: bold; cursor: default; }

.info-banner {
  display: flex;
  align-items: center;
  gap: 6px;
  background: #ffffd5;
  border-bottom: 1px solid #d8d29a;
  padding: 3px 8px;
  color: #3b5a82;
}
.info-banner .ib-i {
  background: #2a70e0; color: #fff;
  border-radius: 50%; width: 13px; height: 13px;
  font-size: 10px; font-weight: bold; font-style: italic;
  text-align: center; line-height: 13px;
  flex: 0 0 auto;
  font-family: Georgia, serif;
}
.info-banner .ib-text { flex: 1; text-decoration: underline; cursor: default; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.info-banner .ib-x { cursor: pointer; color: #8a8a5a; padding: 0 2px; }

.main-tools {
  background: #fff;
  border-bottom: 1px solid #e6eef6;
  padding: 3px 8px;
  display: flex; gap: 10px;
  align-items: center;
}
.tool-ic {
  display: flex; align-items: center; gap: 4px;
  color: var(--link); cursor: pointer; padding: 2px 5px; border-radius: 2px;
  border: 1px solid transparent;
}
.tool-ic:hover { background: #dcecfb; border-color: #a9cdf0; }
.tool-ic svg { width: 15px; height: 15px; }

.main-body-row { flex: 1; display: flex; overflow: hidden; }
.tabstrip {
  width: 30px;
  flex: 0 0 auto;
  background: linear-gradient(90deg, #dceafa, #eef5fc);
  border-right: 1px solid #cbdcee;
  padding-top: 4px;
  display: flex;
  flex-direction: column;
  gap: 2px;
  align-items: center;
}
.tabstrip .tab {
  width: 26px; height: 28px;
  border: 1px solid #b7cde8;
  border-radius: 4px 0 0 4px;
  background: linear-gradient(180deg, #fff, #e4eefb);
  display: flex; align-items: center; justify-content: center;
  cursor: default;
}
.tabstrip .tab.active { background: #fff; border-right-color: #fff; }
.tabstrip .tab svg, .tabstrip .tab img { width: 18px; height: 18px; }

#contactArea { flex: 1; overflow-y: auto; padding: 4px 0; background: #fff; }
.grp-head {
  color: var(--deep); font-weight: bold;
  padding: 5px 8px 3px;
  cursor: pointer;
  display: flex; align-items: center; gap: 5px;
}
.grp-head .box {
  width: 11px; height: 11px;
  border: 1px solid #7f9db9;
  background: #fff;
  color: #444;
  font-size: 9px; line-height: 9px;
  text-align: center;
  font-weight: normal;
}
.contact {
  display: flex; align-items: center; gap: 6px;
  padding: 2px 10px 2px 24px;
  cursor: pointer;
  border: 1px solid transparent;
}
.contact:hover { background: #eaf3fc; border-color: #bcd8f2; }
.contact .c-thumb {
  width: 34px; height: 34px;
  border: 1px solid #98b7d8;
  background: #fff;
  padding: 1px;
  flex: 0 0 auto;
}
.contact .c-thumb img, .contact .c-thumb svg { width: 30px; height: 30px; object-fit: cover; display: block; }
.contact .buddy { flex: 0 0 auto; width: 15px; height: 15px; }
.contact .c-name { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; color: #000; }
.contact .c-pm { color: #93a5b8; font-style: italic; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; flex: 1; }
.contact.offline .c-name { color: #8a8a8a; }
.contact .c-x { visibility: hidden; color: #b04030; font-weight: bold; cursor: pointer; padding: 0 3px; }
.contact:hover .c-x { visibility: visible; }

.add-form { border-top: 1px solid #cbdcee; background: #f4f9fe; padding: 8px; display: none; }
.add-form.open { display: block; }
.add-form input {
  width: 100%; height: 20px; margin-bottom: 5px;
  border: 1px solid #7f9db9; padding: 0 4px;
  font-family: inherit; font-size: 11px;
}
.add-form .row { display: flex; gap: 6px; justify-content: flex-end; }

.banner-box {
  flex: 0 0 auto;
  padding: 6px 10px;
  background: #fff;
  border-top: 1px solid #e6eef6;
  display: flex;
  justify-content: center;
}
.banner-inner {
  width: 100%;
  height: 44px;
  border: 1px solid #7f9db9;
  border-radius: 3px;
  background: linear-gradient(135deg, #16408f 0%, #2a70e0 55%, #4a9be8 100%);
  color: #fff;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
}
.banner-inner img { height: 28px; width: auto; }
.banner-t1 { font-size: 16px; font-weight: bold; text-shadow: 1px 1px 2px rgba(0,0,0,.4); }
.banner-t2 { font-size: 10px; opacity: .9; }

.search-row {
  display: flex;
  gap: 6px;
  padding: 5px 10px;
  background: linear-gradient(180deg, #eef5fc, #dfecf9);
  border-top: 1px solid #cbdcee;
  align-items: center;
}
.search-row input {
  flex: 1;
  height: 21px;
  border: 1px solid #7f9db9;
  padding: 0 5px;
  font-family: inherit; font-size: 11px;
}
.search-btn {
  border: none; background: none;
  color: #1a3e6e; font-weight: bold;
  font-family: inherit; font-size: 11px;
  cursor: pointer;
}
.search-btn:hover { text-decoration: underline; }

.main-foot {
  border-top: 1px solid #cbdcee;
  background: linear-gradient(180deg, #eef5fc, #d8e8f7);
  padding: 4px 8px;
  color: #5b7ba0;
  font-size: 10px;
  display: flex; justify-content: space-between;
}
#netState.ok { color: #2c8a1e; font-weight: bold; }
#netState.bad { color: #c03020; font-weight: bold; }

/* ---------- Csevegőablak ---------- */
.chatwin { width: 560px; height: 520px; min-width: 470px; }
.chatwin .win-body { background: #fff; }

.to-line {
  background: linear-gradient(180deg, #fdfeff, #edf4fb);
  border-bottom: 1px solid #d9e6f2;
  color: #444;
  padding: 4px 8px;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.to-line b { color: #000; }
.to-line .pid { color: #7a95b3; }

.away-bar {
  display: none;
  align-items: center;
  gap: 6px;
  background: #ffffd5;
  border-bottom: 1px solid #d8d29a;
  padding: 3px 8px;
  color: #3b5a82;
}
.away-bar.on { display: flex; }
.away-bar .ib-i {
  background: #2a70e0; color: #fff;
  border-radius: 50%; width: 13px; height: 13px;
  font-size: 10px; font-weight: bold; font-style: italic;
  text-align: center; line-height: 13px;
  font-family: Georgia, serif;
  flex: 0 0 auto;
}

.chat-toolbar {
  display: flex;
  gap: 2px;
  align-items: flex-start;
  padding: 3px 6px 0;
  background:
    radial-gradient(140% 100% at 0% 0%, rgba(255,255,255,.9) 0%, rgba(255,255,255,0) 50%),
    linear-gradient(180deg, #f2f8fd 0%, #dcebf9 70%, #cfe2f5 100%);
  border-bottom: 1px solid var(--line);
}
.tb-big {
  display: flex; flex-direction: column; align-items: center; gap: 1px;
  border: 1px solid transparent; border-radius: 3px;
  background: transparent;
  font-family: inherit; font-size: 10px; color: #274d77;
  padding: 3px 7px 2px;
  cursor: pointer;
  min-width: 50px;
}
.tb-big svg { width: 22px; height: 22px; }
.tb-big:hover:not(:disabled) { background: #e8f3fd; border-color: #a9cdf0; }
.tb-big:disabled { color: #9aa7b5; cursor: default; filter: grayscale(1) opacity(.6); }
.tb-big.active { background: #d5ecc9; border-color: #7fb36a; }
.tb-msn {
  margin-left: auto;
  padding: 8px 6px 0;
  color: #4d6e9b;
  font-size: 13px;
}
.tb-msn b { color: #1a3e6e; }
.tb-msn img { width: 16px; vertical-align: -3px; }

.stream-bar {
  display: none;
  background: linear-gradient(180deg, #e8fbe0, #c8eebc);
  border-bottom: 1px solid #8cc87a;
  color: #205c12;
  padding: 4px 8px;
  align-items: center;
  gap: 8px;
}
.stream-bar.on { display: flex; }
.stream-bar .stop {
  margin-left: auto;
  border: 1px solid #a33; border-radius: 3px;
  background: linear-gradient(180deg, #fff0ee, #f5c9c2);
  color: #8a1a0a; cursor: pointer; padding: 2px 8px;
  font-family: inherit; font-size: 10px;
}

.chat-mid { flex: 1; display: flex; overflow: hidden; }
.msgs-col { flex: 1; display: flex; flex-direction: column; min-width: 0; border-right: 1px solid #e3edf6; }
.warn-line {
  display: flex;
  align-items: center;
  gap: 5px;
  color: #6a7a8a;
  padding: 4px 8px 2px;
  border-bottom: 1px solid #f0f4f8;
}
.warn-line svg { width: 12px; height: 12px; flex: 0 0 auto; }
.msgs {
  flex: 1;
  overflow-y: auto;
  padding: 6px 8px;
  background: #fff;
  user-select: text;
}
.msg { margin-bottom: 6px; word-wrap: break-word; }
.msg .m-head { color: #545454; }
.msg .m-head .m-time { float: right; color: #b5c5d5; font-size: 10px; }
.msg .m-body { color: #000; padding: 1px 0 0 14px; font-size: 12px; line-height: 1.45; }
.msg.sys { color: #909090; }
.emo {
  display: inline-block;
  width: 19px; height: 19px;
  background-image: var(--emo);
  background-repeat: no-repeat;
  vertical-align: -5px;
}

.dp-col {
  width: 190px;
  flex: 0 0 auto;
  background:
    radial-gradient(150% 120% at 100% 100%, #dcebf9 0%, rgba(255,255,255,0) 55%),
    linear-gradient(180deg, #f8fbfe, #eef5fc);
  display: flex;
  flex-direction: column;
  justify-content: space-between;
  align-items: center;
  padding: 8px 0;
}
.dp-64 { width: 152px; height: 152px; }
.dp-64 img, .dp-64 svg { width: 146px; height: 146px; object-fit: cover; }
.dp-chev {
  width: 152px;
  text-align: right;
  color: #7fa8d0;
  font-size: 9px;
  border: 1px solid #c3d6e8;
  border-top: none;
  background: linear-gradient(180deg, #eef5fc, #dcebf9);
  padding: 0 3px;
  cursor: default;
}
.dp-tag { font-size: 11px; color: #7a95b3; margin-top: 3px; text-align: center; max-width: 180px;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

.fmt-bar {
  display: flex;
  align-items: center;
  gap: 3px;
  border-top: 1px solid var(--line);
  background: linear-gradient(180deg, #f2f8fd, #e2eefa);
  padding: 2px 6px;
  position: relative;
}
.fmt-btn {
  border: 1px solid transparent; border-radius: 2px;
  background: transparent;
  font-family: inherit; font-size: 11px;
  padding: 2px 5px;
  cursor: pointer;
  display: flex; align-items: center; gap: 3px;
  color: #274d77;
}
.fmt-btn:hover:not(:disabled) { background: #e8f3fd; border-color: #a9cdf0; }
.fmt-btn:disabled { color: #9aa7b5; cursor: default; }
.fmt-btn .emo { vertical-align: -4px; }
.fmt-btn.toggled { background: #cfe4f7; border-color: #7fa8d0; }
.fmt-btn.rec { background: #f5c9c2; border-color: #a33; color: #8a1a0a; }
.fmt-sep { width: 1px; height: 16px; background: #c3d6e8; margin: 0 3px; }

/* A (betűtípus) felugró */
.font-pop {
  position: absolute;
  bottom: 26px;
  left: 4px;
  background: #fff;
  border: 1px solid #8ab1d8;
  box-shadow: 2px 3px 8px rgba(0,0,0,.3);
  padding: 7px;
  display: none;
  z-index: 620;
  align-items: center;
  gap: 6px;
}
.font-pop.open { display: flex; }
.fmt-color {
  width: 26px; height: 20px;
  border: 1px solid #8ab1d8;
  padding: 0; background: none; cursor: pointer;
}

/* hátterek felugró */
.bg-pop {
  position: absolute;
  bottom: 26px;
  left: 120px;
  background: #fff;
  border: 1px solid #8ab1d8;
  box-shadow: 2px 3px 8px rgba(0,0,0,.3);
  padding: 6px;
  display: none;
  grid-template-columns: repeat(3, 44px);
  gap: 4px;
  z-index: 620;
}
.bg-pop.open { display: grid; }
.bg-pop .bg-cell {
  width: 44px; height: 32px;
  border: 1px solid #b7cde8;
  cursor: pointer;
}
.bg-pop .bg-cell:hover { border-color: #f0a030; }

.input-area {
  background: linear-gradient(180deg, #eef5fc, #dcebf9);
  padding: 5px 6px 6px;
  display: flex; gap: 6px;
  flex: 0 0 auto;
}
.input-area textarea {
  flex: 1;
  height: 52px;
  resize: none;
  border: 1px solid #7f9db9;
  padding: 4px 6px;
  font-family: inherit; font-size: 12px;
  background: #fff;
}
.send-col { display: flex; flex-direction: column; }
.send-col .send-btn {
  min-width: 62px;
  flex: 1;
  border: 1px solid #7f9db9;
  border-bottom: none;
  border-radius: 3px 3px 0 0;
  background: linear-gradient(180deg, #ffffff, #e8f0f8);
  color: #1a3e6e;
  font-weight: bold;
  font-family: inherit; font-size: 11px;
  cursor: pointer;
}
.send-col .search-btn2 {
  min-width: 62px;
  height: 20px;
  border: 1px solid #7f9db9;
  border-radius: 0 0 3px 3px;
  background: linear-gradient(180deg, #f2f6fa, #dde8f2);
  color: #7a95b3;
  font-family: inherit; font-size: 10px;
  cursor: pointer;
}
.send-col .send-btn:hover, .send-col .search-btn2:hover { box-shadow: inset 0 0 0 1px #ffc73c; }

.chat-status {
  border-top: 1px solid #cbdcee;
  background: linear-gradient(180deg, #eef5fc, #d8e8f7);
  color: #5b7ba0;
  font-size: 10px;
  padding: 3px 8px;
  height: 20px;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}

/* hangulatjel-választó */
.emo-pop {
  position: absolute;
  bottom: 110px;
  left: 8px;
  background: #fff;
  border: 1px solid #8ab1d8;
  box-shadow: 2px 3px 8px rgba(0,0,0,.3);
  padding: 6px;
  display: none;
  grid-template-columns: repeat(10, 23px);
  gap: 1px;
  z-index: 600;
}
.emo-pop.open { display: grid; }
.emo-pop .emo-cell {
  width: 23px; height: 23px;
  display: flex; align-items: center; justify-content: center;
  cursor: pointer;
  border: 1px solid transparent;
}
.emo-pop .emo-cell:hover { border-color: #f0c05a; background: #fdf3d7; }

/* rezgetés */
@keyframes nudgeShake {
  0%,100% { transform: translate(0,0); }
  10% { transform: translate(-7px,-4px); } 20% { transform: translate(6px,5px); }
  30% { transform: translate(-6px,3px); }  40% { transform: translate(7px,-5px); }
  50% { transform: translate(-5px,-6px); } 60% { transform: translate(5px,4px); }
  70% { transform: translate(-7px,2px); }  80% { transform: translate(4px,-4px); }
  90% { transform: translate(-3px,5px); }
}
.nudging { animation: nudgeShake .55s linear 2; }

/* ---------- Fájlátvitel ---------- */
.file-line {
  border: 1px solid #cfe0f0;
  background: #f4f9fe;
  border-radius: 3px;
  padding: 5px 8px;
  margin: 4px 0 6px 14px;
  max-width: 320px;
}
.file-line .f-name { font-weight: bold; color: #24466f; word-break: break-all; }
.file-line .f-size { color: #7a95b3; font-size: 10px; }
.file-line .f-prog {
  height: 10px;
  border: 1px solid #9ebedd;
  background: #fff;
  margin-top: 4px;
  border-radius: 2px;
  overflow: hidden;
}
.file-line .f-prog > div {
  height: 100%;
  width: 0%;
  background: linear-gradient(180deg, #8fd47f, #4aa832);
}
.file-line a { color: #2a5da8; font-weight: bold; }
.file-line img.thumb { max-width: 200px; max-height: 150px; display: block; margin-top: 4px; border: 1px solid #b7cde8; }
.file-line .f-btns { margin-top: 4px; display: flex; gap: 5px; }

/* ---------- Hívásablak ---------- */
.callwin { width: 460px; height: 400px; }
.callwin .win-body { background: #16202b; }
.call-stage { flex: 1; position: relative; background: #000; min-height: 0;
  display: flex; align-items: center; justify-content: center; }
.call-stage video.remote { width: 100%; height: 100%; object-fit: contain; }
.call-stage video.self {
  position: absolute; right: 8px; bottom: 8px;
  width: 110px; height: 82px; object-fit: cover;
  border: 1px solid #4a5a6a; background: #111;
}
.call-stage .voice-face { text-align: center; color: #cfe0ee; }
.call-stage .voice-face .dp { margin: 0 auto 8px; }
.call-stage .voice-face .dp-64 { width: 96px; height: 96px; }
.call-stage .voice-face .dp-64 img, .call-stage .voice-face .dp-64 svg { width: 90px; height: 90px; }
.call-bar {
  background: linear-gradient(180deg, #2c3540, #1a2129);
  color: #cfe0ee;
  padding: 5px 8px;
  display: flex; align-items: center; gap: 8px;
  flex: 0 0 auto;
}
.call-bar .timer { font-weight: bold; color: #8fd47f; }
.call-bar button {
  border: 1px solid #4a5a6a; border-radius: 3px;
  background: #2c3a48; color: #cfe0ee;
  font-family: inherit; font-size: 10px;
  padding: 2px 10px; cursor: pointer;
}
.call-bar button:hover { background: #3a4c5e; }
.call-bar button.hang { background: #7a2318; border-color: #a33; margin-left: auto; }
.call-bar button.hang:hover { background: #93301f; }
.call-bar button.mute-on { background: #6a5a18; }

/* hangüzenet */
.vclip-line { margin: 3px 0 6px 14px; }
.vclip-line audio { height: 26px; max-width: 260px; }

/* ---------- Stream néző ---------- */
.viewerwin { width: 640px; height: 460px; }
.viewerwin .win-body { background: #101418; }
.viewerwin video { width: 100%; height: 100%; object-fit: contain; background: #000; flex: 1; min-height: 0; }
.viewer-bar {
  background: linear-gradient(180deg, #2c3540, #1a2129);
  color: #cfe0ee;
  padding: 4px 8px;
  display: flex; align-items: center; gap: 8px;
  flex: 0 0 auto;
}
.viewer-bar .live {
  background: #d02818; color: #fff; font-weight: bold;
  border-radius: 2px; padding: 1px 5px; font-size: 10px;
}
.viewer-bar .vstate { color: #8fa8c0; font-size: 10px; }
.viewer-bar button {
  border: 1px solid #4a5a6a; border-radius: 3px;
  background: #2c3a48; color: #cfe0ee;
  font-family: inherit; font-size: 10px;
  padding: 2px 8px; cursor: pointer;
}
.viewer-bar button:hover { background: #3a4c5e; }
.viewer-bar .vunmute { background: #6a5a18; border-color: #9a8a3a; display: none; }
.viewer-bar .vretry { background: #1a4f85; border-color: #2b70b5; color: #fff; margin-left: 6px; }
.viewer-bar .vretry:hover { background: #2664a3; }
.viewer-bar .vfull { margin-left: auto; }

.ask-box {
  background: #fffbe6;
  border-bottom: 1px solid #e0d48a;
  padding: 6px 8px;
  display: flex; align-items: center; gap: 8px;
  color: #5c4d10;
}
.ask-box .row { margin-left: auto; display: flex; gap: 5px; }

/* tiltott partner */
#myDp { cursor: pointer; }
#myDp:hover { outline: 2px solid #ffc73c; }

/* görgetősáv */
::-webkit-scrollbar { width: 15px; }
::-webkit-scrollbar-track { background: #f0f4f8; }
::-webkit-scrollbar-thumb {
  background: linear-gradient(90deg, #d6e5f5, #b6cfeb);
  border: 1px solid #9ebedd; border-radius: 7px;
}

/* ---------- Átméretezhető ablakok ---------- */
.chatwin, .viewerwin, .callwin, .imgwin, #mainWin {
  resize: both;
  overflow: hidden;
  min-height: 300px;
}

/* ---------- Válasz (reply) ---------- */
.msg { position: relative; }
.msg .reply-btn {
  position: absolute; right: 2px; top: 0;
  display: none; cursor: pointer; color: #7a95b3;
  font-size: 12px; padding: 0 3px;
  background: #fff; border: 1px solid #d5e5f2; border-radius: 2px;
}
.msg:hover .reply-btn { display: inline-block; }
.reply-q {
  border-left: 3px solid #a9cdf0;
  background: #f2f8fd;
  color: #54749a;
  padding: 2px 6px;
  margin: 2px 0 2px 14px;
  font-size: 11px;
  max-width: 90%;
  overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
}
.reply-q b { color: #38618c; }
.reply-bar {
  display: none;
  gap: 6px; align-items: center;
  background: #f2f8fd;
  border-top: 1px solid var(--line);
  padding: 3px 8px;
  color: #54749a;
  font-size: 10px;
}
.reply-bar.on { display: flex; }
.reply-bar .rq { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.reply-bar .rx { cursor: pointer; color: #b04030; font-weight: bold; padding: 0 4px; }

/* ---------- Üzenetben linkek ---------- */
.m-body a { color: #2a5da8; }

/* ---------- Kép-néző ablak ---------- */
.imgwin { width: 560px; height: 460px; }
.imgwin .win-body { background: #1a1f26; }
.imgwin .img-holder { flex: 1; min-height: 0; display: flex; align-items: center; justify-content: center; }
.imgwin img { max-width: 100%; max-height: 100%; object-fit: contain; }
.img-bar {
  background: linear-gradient(180deg, #2c3540, #1a2129);
  color: #cfe0ee; padding: 4px 8px;
  display: flex; align-items: center; gap: 8px;
  flex: 0 0 auto; font-size: 10px;
}
.img-bar button {
  margin-left: auto;
  border: 1px solid #4a5a6a; border-radius: 3px;
  background: #2c3a48; color: #cfe0ee;
  font-family: inherit; font-size: 10px;
  padding: 2px 8px; cursor: pointer;
}
.file-line img.thumb { cursor: zoom-in; }

/* ---------- Kacsintók ---------- */
.chatwin .win-body { position: relative; }
.wink-overlay { position: absolute; inset: 0; pointer-events: none; overflow: hidden; z-index: 80; }
.wink-p { position: absolute; top: -30px; font-size: 22px; animation: winkFall 2.6s ease-in forwards; }
@keyframes winkFall {
  0% { transform: translateY(0) scale(.6) rotate(0); opacity: 0; }
  15% { opacity: 1; }
  100% { transform: translateY(520px) rotate(50deg); opacity: 0; }
}
.wink-big {
  position: absolute; left: 50%; top: 42%;
  transform: translate(-50%,-50%) scale(0);
  font-size: 72px;
  animation: winkPop 2.3s ease forwards;
}
@keyframes winkPop {
  0% { transform: translate(-50%,-50%) scale(0); opacity: 0; }
  30% { transform: translate(-50%,-50%) scale(1.5); opacity: 1; }
  70% { transform: translate(-50%,-50%) scale(1.15); opacity: 1; }
  100% { transform: translate(-50%,-50%) scale(0); opacity: 0; }
}
.wink-pop {
  position: absolute;
  bottom: 26px; left: 150px;
  background: #fff;
  border: 1px solid #8ab1d8;
  box-shadow: 2px 3px 8px rgba(0,0,0,.3);
  padding: 6px;
  display: none;
  grid-template-columns: repeat(3, 52px);
  gap: 4px;
  z-index: 620;
}
.wink-pop.open { display: grid; }
.wink-pop .wk-cell {
  width: 52px; height: 44px;
  border: 1px solid #b7cde8;
  display: flex; align-items: center; justify-content: center;
  font-size: 24px; cursor: pointer; background: #f7fbff;
}
.wink-pop .wk-cell:hover { border-color: #f0a030; background: #fdf3d7; }

/* ---------- Meghívás-választó ---------- */
.pickwin { width: 260px; }
.pickwin .win-body { background: #fff; padding: 8px; }
.pick-title { color: var(--deep); font-weight: bold; margin-bottom: 6px; }
.pick-item {
  display: flex; align-items: center; gap: 6px;
  padding: 4px 6px; cursor: pointer;
  border: 1px solid transparent;
}
.pick-item:hover { background: #eaf3fc; border-color: #bcd8f2; }
.pick-item .c-thumb { width: 26px; height: 26px; border: 1px solid #98b7d8; padding: 1px; }
.pick-item .c-thumb img, .pick-item .c-thumb svg { width: 22px; height: 22px; display: block; }
.pick-none { color: #8a9ab0; font-style: italic; padding: 6px; }
.pick-row { text-align: right; margin-top: 8px; }

/* csoportablak: nincs képoszlop */
.groupwin .dp-col { display: none; }
.groupwin .msgs-col { border-right: none; }

/* ---------- Asztali beállítások (fogaskerék + ablak) ---------- */
.desk-gear {
  position: fixed;
  right: 16px; bottom: 16px;
  width: 38px; height: 38px;
  border-radius: 50%;
  background: rgba(255,255,255,.22);
  border: 1px solid rgba(255,255,255,.5);
  display: flex; align-items: center; justify-content: center;
  cursor: pointer;
  z-index: 4;
  font-size: 20px;
  color: #fff;
  text-shadow: 1px 1px 2px rgba(0,0,0,.5);
}
.desk-gear:hover { background: rgba(255,255,255,.38); }
.setwin { width: 300px; }
.setwin .win-body { background: #fff; padding: 12px; }
.set-row { display: flex; align-items: center; gap: 8px; margin-bottom: 10px; }
.set-row label { flex: 1; color: #333; }
.set-row input[type="color"] { width: 48px; height: 26px; border: 1px solid #7f9db9; padding: 0; cursor: pointer; }
.set-btns { display: flex; justify-content: space-between; margin-top: 6px; }

/* ---------- Azonnali képüzenet ---------- */
.img-msg { margin: 3px 0 6px 14px; }
.img-msg img {
  max-width: 260px;
  max-height: 200px;
  display: block;
  border: 1px solid #b7cde8;
  border-radius: 3px;
  cursor: zoom-in;
  background: #fff;
}
.img-msg img:hover { border-color: #f0a030; }
.img-dl { display: inline-block; margin-top: 3px; font-size: 10px; color: #2a5da8; }

/* ---------- Behúzás (drag & drop) ---------- */
.drop-overlay {
  position: absolute;
  inset: 0;
  display: none;
  align-items: center;
  justify-content: center;
  background: rgba(42, 112, 224, .18);
  border: 3px dashed #2a70e0;
  border-radius: 8px;
  color: #14396f;
  font-size: 13px;
  font-weight: bold;
  text-shadow: 0 1px 2px rgba(255,255,255,.8);
  z-index: 700;
  pointer-events: none;
}
.drop-overlay.on { display: flex; }

/* ---------- Mobil / érintőképernyős elrendezés ---------- */
@media (max-width: 820px) {
  html, body { font-size: 13px; }

  /* az ablakok kitöltik a képernyőt, egymás fölött rétegezve */
  .win {
    position: fixed !important;
    left: 0 !important; top: 0 !important;
    width: 100% !important; height: 100% !important;
    /* a min-width felülírása nélkül a keskeny kijelzőn kilógna az ablak
       (és vele a Küldés gomb) */
    min-width: 0 !important; max-width: 100vw !important;
    max-height: none !important;
    border-radius: 0;
    border-width: 0;
    resize: none;
    transform: none !important;
    box-shadow: none;
  }
  /* a bejelentkező ablak teljes képernyős, a főablak csak belépés után
     jelenik meg (a JS állítja) — így mobilon is bejelentkezéssel indul */
  #loginWin { display: flex; }

  .titlebar { height: 34px; font-size: 14px; }
  .tbtn { width: 30px; height: 28px; line-height: 26px; font-size: 14px; }

  /* nagyobb érintőfelületek */
  .menubar .m-item { padding: 7px 11px; }
  .menu-pop { min-width: 220px; }
  .menu-pop .mp-item { padding: 9px 18px 9px 24px; }
  .contact { padding: 7px 10px 7px 14px; }
  .contact .c-thumb { width: 40px; height: 40px; }
  .contact .c-thumb img, .contact .c-thumb svg { width: 36px; height: 36px; }
  .contact .c-x { visibility: visible; padding: 0 7px; font-size: 13px; }
  .grp-head { padding: 9px 8px 7px; }
  .xp-btn { height: 34px; min-width: 96px; font-size: 12px; }
  .fld input, .fld select { height: 34px; font-size: 13px; }
  .copy-btn { height: 22px; font-size: 11px; padding: 0 7px; }

  /* csevegőablak: a képoszlop és a webkereső elrejtve, több hely a szövegnek */
  .dp-col { display: none; }
  .msgs-col { border-right: none; }
  .msgs { font-size: 13px; padding: 8px; }
  .msg .m-body { font-size: 14px; }
  .search-row, .banner-box, .tabstrip, .brand-band { display: none; }
  /* a beviteli mező zsugorodhasson, hogy a Küldés gomb ne lógjon ki */
  .input-area { padding: 5px 5px 6px; }
  .input-area textarea { height: 60px; font-size: 15px; min-width: 0; }
  .send-col { flex: 0 0 auto; }
  .send-col .send-btn { min-width: 68px; width: 68px; font-size: 13px; }
  .send-col .search-btn2 { display: none; }
  .send-col .send-btn { border-radius: 3px; border-bottom: 1px solid #7f9db9; }

  /* eszköztár görgethető, ne törjön szét */
  .chat-toolbar { overflow-x: auto; flex-wrap: nowrap; }
  .tb-big { min-width: 56px; padding: 5px 8px 4px; }
  .tb-big svg { width: 26px; height: 26px; }
  .tb-msn { display: none; }
  .fmt-bar { overflow-x: auto; flex-wrap: nowrap; }
  .fmt-btn { padding: 6px 7px; }

  /* felugrók a képernyőhöz igazítva */
  .emo-pop { grid-template-columns: repeat(8, 30px); bottom: 130px; left: 4px; }
  .emo-pop .emo-cell { width: 30px; height: 30px; }
  .wink-pop { grid-template-columns: repeat(3, 60px); left: 4px; }
  .wink-pop .wk-cell { width: 60px; height: 52px; font-size: 27px; }
  .bg-pop { left: 4px; }

  .img-msg img { max-width: 78vw; max-height: 46vh; }
  .update-bar { font-size: 11px; padding: 6px 8px; }
  .desk-gear { right: 10px; bottom: 10px; width: 44px; height: 44px; font-size: 23px; }

  /* mobilon a behúzás nem értelmezett */
  .drop-overlay { display: none !important; }

  .callwin .call-stage video.self { width: 88px; height: 66px; }
  .call-bar button { padding: 7px 11px; }
  .viewer-bar button { padding: 6px 10px; }
}

/* nagyon keskeny kijelző */
@media (max-width: 420px) {
  .tb-big { min-width: 50px; font-size: 9px; }
  .emo-pop { grid-template-columns: repeat(7, 30px); }
}

/* ---------- Mobil: egyszerre egy ablak látszik ---------- */
@media (max-width: 820px) {
  .win.m-hidden { display: none !important; }

  /* vissza-nyíl a címsorban */
  .titlebar .m-back {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    width: 26px; height: 28px;
    margin-right: 4px;
    font-size: 24px;
    line-height: 1;
    cursor: pointer;
    color: #fff;
    flex: 0 0 auto;
  }
  .titlebar .m-back:active { opacity: .6; }

  /* a beállítás- és választóablakok is teljes képernyősek */
  .setwin, .pickwin { width: 100% !important; height: 100% !important; }
  .setwin .win-body, .pickwin .win-body { padding: 16px; }
  .set-row input[type="range"] { height: 34px; }
  .pick-item { padding: 10px 8px; }
  .pick-item .c-thumb { width: 40px; height: 40px; }
  .pick-item .c-thumb img, .pick-item .c-thumb svg { width: 36px; height: 36px; }
}

/* asztali gépen nincs vissza-nyíl */
.titlebar .m-back { display: none; }

/* a betűtípus-választó a formázó felugróban */
.font-pop { flex-wrap: wrap; max-width: 280px; }
.fmt-font {
  font-family: inherit;
  font-size: 11px;
  height: 24px;
  border: 1px solid #7f9db9;
  background: #fff;
  max-width: 150px;
}
.set-row .scale-val { color: #1a3e6e; font-weight: bold; min-width: 46px; text-align: right; }

/* ---------- Méretezés-vezérlők ---------- */
.set-scale-btns { gap: 6px; }
.set-scale-btns .xp-btn { min-width: 0; flex: 1; }

/* ---------- Idézet-előnézet (képre válasz) ---------- */
.reply-q { display: flex; align-items: center; gap: 5px; }
.rq-th, .reply-bar .rq-th {
  width: 26px; height: 26px;
  object-fit: cover;
  border: 1px solid #a9cdf0;
  border-radius: 2px;
  flex: 0 0 auto;
  vertical-align: middle;
}
.reply-bar .rq { display: flex; align-items: center; gap: 5px; }

/* ---------- Frissítés-jelző (nem zavaró) ---------- */
.update-bar {
  display: flex;
  align-items: center;
  gap: 8px;
  background: linear-gradient(180deg, #fdfbe8, #f6f0cd);
  border-top: 1px solid #ddd6a0;
  color: #5c5218;
  padding: 4px 8px;
  font-size: 10px;
}

function slotId(base, n) { return n <= 1 ? base : base + '_dev' + n; }
function baseOf(peerId) {
  const m = /^(.*)_dev\d+$/.exec(String(peerId));
  return m ? m[1] : String(peerId);

// base -> Map(tényleges peerId -> kapcsolat): egy partner több eszköze
const deviceConns = new Map();
function addDeviceConn(base, c) {
  if (!deviceConns.has(base)) deviceConns.set(base, new Map());
  deviceConns.get(base).set(c.peer, c);
}
function removeDeviceConn(base, peerId) {
  const m = deviceConns.get(base);
  if (!m) return;
  m.delete(peerId);
  if (!m.size) deviceConns.delete(base);
}
// üzenet küldése a partner MINDEN bejelentkezett eszközére
function sendTo(base, obj) {
  const m = deviceConns.get(base);
  let sent = false;
  if (m) for (const c of m.values()) {
    if (c.open) { try { c.send(obj); sent = true; } catch {} }
  }
  return sent;
}

async function askGemini(prompt, history = [], options = {}) {
  if (!geminiState.enabled && !options.force) {
    throw new Error('Gemini AI ki van kapcsolva a beállításokban.');
  }
  const url = (options.url || geminiState.url || DEFAULT_GEMINI_URL).replace(/\/+$/, '');
  const key = options.key || geminiState.key || DEFAULT_GEMINI_KEY;
  const model = options.model || geminiState.model || 'gemini-3.7-flash';
  const thinking = options.thinking || geminiState.thinking || 'low';
  const thinkingBudget = thinking === 'high' ? 8192 : 2048;

  if (url.includes('googleapis.com')) {
    const endpoint = url + '/models/' + model + ':generateContent?key=' + key;
    const contents = [
      ...history.map(h => ({ role: h.role === 'user' ? 'user' : 'model', parts: [{ text: h.content }] })),
      { role: 'user', parts: [{ text: prompt }] }
    ];
    const res = await fetch(endpoint, {
      method: 'POST',
      mode: 'cors',
      credentials: 'omit',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        system_instruction: { parts: [{ text: geminiState.systemPrompt }] },
        contents,
        generationConfig: {
          thinkingConfig: { thinkingBudget }
        }
      })
    });
    if (!res.ok) {
      const errTxt = await res.text();
      throw new Error('Gemini API (' + res.status + '): ' + errTxt.slice(0, 160));
    }
    const data = await res.json();
    return data.candidates?.[0]?.content?.parts?.[0]?.text || '(Nincs válasz)';
  } else {
    const endpoint = url.endsWith('/chat/completions') ? url : url + '/chat/completions';
    const messages = [
      { role: 'system', content: geminiState.systemPrompt + '\n[Thinking Mode: ' + thinking.toUpperCase() + ' (Budget: ' + thinkingBudget + ' tokens)]' },
      ...history.slice(-8),
      { role: 'user', content: prompt }
    ];
    let chosenModel = model;
    if ((chosenModel === 'gemini-3.7-flash' || chosenModel === 'gemini-2.5-flash') && url.includes('seekai.cc')) {
      chosenModel = 'gemini-3-6-flash';
    }
    const res = await fetch(endpoint, {
      method: 'POST',
      mode: 'cors',
      credentials: 'omit',
      headers: {
        'Content-Type': 'application/json',
        'Authorization': 'Bearer ' + key
      },
      body: JSON.stringify({
        model: chosenModel,
        messages,
        max_tokens: 4096,
        temperature: 0.7
      })
    });
    if (!res.ok) {
      const errTxt = await res.text();
      throw new Error('AI API (' + res.status + '): ' + errTxt.slice(0, 160));
    }
    const data = await res.json();
    return data.choices?.[0]?.message?.content || '(Nincs válasz)';
  }
}

async function handleGeminiDirectChat(userMsg) {
  const w = chatWins.get('gemini');
  if (w && w.status) {
    w.status.textContent = t('geminiTyping');
  }
  const hist = loadHist('gemini').filter(h => h.k === 'm').map(h => ({
    role: h.n === me.name ? 'user' : 'assistant',
    content: h.x
  }));

  try {
    const reply = await askGemini(userMsg, hist, { thinking: geminiState.thinking });
    if (w && w.status) w.status.textContent = '';
    const fmt = { font: 'Segoe UI, sans-serif', color: '#1a73e8', bold: false };
    addMsg('gemini', 'Gemini 3.7 Flash', reply, false, fmt, undefined, { remoteId: 'gem_' + Date.now() });
    sndMsg();
  } catch (err) {
    if (w && w.status) w.status.textContent = '';
    sysMsg('gemini', '⚠️ ' + err.message);
  }
}

async function handleGeminiMention(pid, rawText) {
  const query = rawText.replace(/@(gemini|ai)\b/gi, '').trim() || 'Szia Gemini!';
  const w = chatWins.get(pid);
  if (w && w.status) {
    w.status.textContent = t('geminiTyping');
  }
  const c = conns.get(pid);
  if (c && c.open) {
    try { c.send({ t: 'typing' }); } catch {}
  }

  try {
    const reply = await askGemini(query, [], { thinking: geminiState.thinking });
    if (w && w.status) w.status.textContent = '';
    const fmt = { font: 'Segoe UI, sans-serif', color: '#1a73e8', bold: false };
    const geminiText = '✨ [Gemini 3.7 Flash (' + (geminiState.thinking === 'high' ? 'High' : 'Low') + ' Thinking)]:\n' + reply;
    
    addMsg(pid, 'Gemini (AI)', geminiText, false, fmt, undefined, { remoteId: 'gem_' + Date.now() });
    sndMsg();

    if (c && c.open) {
      const mid = me.baseId + '_' + Date.now() + '_' + (++msgIdCounter);
      sendTo(pid, { t: 'msg', text: geminiText, fmt, mid });
    }
  } catch (err) {
    if (w && w.status) w.status.textContent = '';
    sysMsg(pid, '⚠️ Gemini hiba: ' + err.message);
  }
}

const EMO_LOOKUP = [];
EMO.forEach((codes, idx) => {
  for (const c of codes) EMO_LOOKUP.push([escHtml(c), idx]);
});
EMO_LOOKUP.sort((a, b) => b[0].length - a[0].length);

function escHtml(s) {
  return String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
}
function emoHtml(idx, titleCode) {
  if (A) {
    return '<span class="emo" style="background-position:-' + (idx * 19) +
      'px 0" title="' + (titleCode || escHtml(EMO[idx][0])) + '"></span>';
  }
  return EMO_FALLBACK[idx] || '';
}
function emotify(escaped) {
  let out = escaped;
  const used = [];
  for (const [code, idx] of EMO_LOOKUP) {
    if (out.indexOf(code) !== -1) {
      const ph = 'EMOPH' + used.length + 'HP';
      used.push([ph, emoHtml(idx, code)]);
      out = out.split(code).join(ph);
    }
  }
  for (const [ph, html] of used) out = out.split(ph).join(html);

}
// YouTube-link felismerése (watch, youtu.be, shorts, embed)
function ytId(url) {
  try {
    const u = new URL(url);
    const h = u.hostname.replace(/^www\./, '');
    if (h === 'youtu.be') {
      const id = u.pathname.slice(1).split('/')[0];
      return /^[\w-]{11}$/.test(id) ? id : null;
    }
    if (h === 'youtube.com' || h === 'm.youtube.com' || h === 'music.youtube.com') {
      if (u.pathname === '/watch') {
        const id = u.searchParams.get('v') || '';
        return /^[\w-]{11}$/.test(id) ? id : null;
      }
      const m = /^\/(shorts|embed|v|live)\/([\w-]{11})/.exec(u.pathname);
      if (m) return m[2];
    }
  } catch { /* nem érvényes URL */ }
  return null;
}

function renderBody(text) {
  let s = escHtml(text);
  const links = [];
  s = s.replace(/(https?:\/\/[^\s<>"']+)/g, m => {
    links.push(m);
    return 'LNKPH' + (links.length - 1) + 'HP';
  });
  s = emotify(s);
  links.forEach((u, i) => {
    const ytid = ytId(u);
    const html = ytid
      ? ytEmbedHtml(ytid, u)
      : '<a href="' + escHtml(u) + '" target="_blank" rel="noopener">' + escHtml(u) + '</a>';
    s = s.split('LNKPH' + i + 'HP').join(html);
  });
  return s.replace(/\n/g, '<br>');
}

function updateTaskbar() {

  const windows = Array.from(document.querySelectorAll('.win')).filter(w => {
    if (w.id === 'loginWin' && w.style.display === 'none') return false;
    if (!document.body.contains(w)) return false;

  let highestZ = -1;
  let topWin = activeWin;
  for (const w of windows) {
    if (w.classList.contains('minimized')) continue;
    const z = parseInt(w.style.zIndex || '0', 10);

let audioCtx = null;
function beep(seq) {
  try {
    audioCtx = audioCtx || new (window.AudioContext || window.webkitAudioContext)();
    let tt = audioCtx.currentTime;
    for (const [freq, dur] of seq) {
      const o = audioCtx.createOscillator();
      const g = audioCtx.createGain();
      o.frequency.value = freq; o.type = 'sine';
      g.gain.setValueAtTime(0.12, tt);
      g.gain.exponentialRampToValueAtTime(0.001, tt + dur);
      o.connect(g).connect(audioCtx.destination);
      o.start(tt); o.stop(tt + dur);
      tt += dur * 0.9;
    }
  } catch { /* hang nélkül is működik */ }
}
function mkSound(dataUri, fallbackSeq) {
  let audio = null;
  if (dataUri) { try { audio = new Audio(dataUri); } catch {} }
  return () => {
    if (muted) return;
    if (audio) {
      try { audio.currentTime = 0; audio.play().catch(() => {}); return; } catch {}
    }
    beep(fallbackSeq);
  };
}

// Alapelrendezés asztali gépen: a főablak balra, teljes magasságban,
// a csevegőablak pedig a maradék helyet tölti ki (mint a klasszikus
// MSN-nél két külön ablakkal).
function deskLayout() {
  const z = (parseInt(localStorage.getItem('msn75_scale') || '0', 10) || defaultScale()) / 100;
  const vw = window.innerWidth / z;
  const vh = window.innerHeight / z;
  const gap = 12;
  const mainW = Math.max(260, Math.min(300, Math.round(vw * 0.22)));
  return {
    vw, vh, gap, mainW,
    mainH: Math.max(420, Math.round(vh - gap * 2 - 46)),
    chatX: mainW + gap * 2,
    chatW: Math.max(430, Math.round(vw - mainW - gap * 3)),
    // alul marad hely a beállítás-fogaskeréknek
    chatH: Math.max(400, Math.round(vh - gap * 2 - 46)),
  };
}

function applyDeskLayout() {
  if (isMobile()) return;

  const mw = $('#mainWin');

    mw.style.left = L.gap + 'px';

// minden ablak maradjon a látható területen belül
function clampWindows(zoom) {
  const vw = window.innerWidth / zoom;
  const vh = window.innerHeight / zoom;
  document.querySelectorAll('.win').forEach(w => {
    if (w.style.display === 'none' || !w.offsetWidth) return;
    const left = parseFloat(w.style.left);
    const top = parseFloat(w.style.top);
    if (!isNaN(left)) {
      const maxL = Math.max(0, vw - Math.min(w.offsetWidth, vw) * 0.35);
      if (left > maxL) w.style.left = Math.max(0, maxL) + 'px';
    }
    if (!isNaN(top)) {
      const maxT = Math.max(0, vh - 40);
      if (top > maxT) w.style.top = Math.max(0, maxT) + 'px';
    }
    // a túl nagy ablakok se lógjanak ki
    if (w.offsetWidth > vw) w.style.width = Math.round(vw) + 'px';
    if (w.offsetHeight > vh) w.style.height = Math.round(vh) + 'px';
  });
}

    win.style.left = Math.max(0, (window.innerWidth / (s / 100) - win.offsetWidth) / 2) + 'px';
    win.style.top = '40px';
  });
}

// ---------- mobil: egyszerre egy ablak (mint egy normál mobil app) ----------
function isMobile() { return window.matchMedia('(max-width: 820px)').matches; }

// az egymásra nyíló ablakok sorrendje, hogy a Vissza működjön
const mobileStack = [];

function mobileShow(win) {
  if (!isMobile() || !win) return;
  document.querySelectorAll('.win').forEach(w => {
    if (w !== win) w.classList.add('m-hidden');
  });
  win.classList.remove('m-hidden');
  const i = mobileStack.indexOf(win);
  if (i !== -1) mobileStack.splice(i, 1);
  mobileStack.push(win);
  win.scrollTop = 0;
}

// vissza az előző ablakra (a főablak a legalsó szint)
function mobileBack() {
  if (!isMobile()) return false;
  mobileStack.pop();
  while (mobileStack.length && !document.body.contains(mobileStack[mobileStack.length - 1])) {
    mobileStack.pop();
  }
  const prev = mobileStack[mobileStack.length - 1] || $('#mainWin');
  if (prev) {
    document.querySelectorAll('.win').forEach(w => {
      if (w !== prev) w.classList.add('m-hidden');
    });
    prev.classList.remove('m-hidden');
    if (mobileStack[mobileStack.length - 1] !== prev) mobileStack.push(prev);
  }
  return mobileStack.length > 1;
}
// az Android alkalmazás vissza gombja ezt hívja
window.msnMobileBack = function () {
  if (!isMobile()) return false;
  // ha a főablaknál vagyunk, az app kiléphet
  const top = mobileStack[mobileStack.length - 1];
  if (!top || top === $('#mainWin')) return false;
  mobileBack();
  return true;
};

// vissza-nyíl a címsorba (mobilon jelenik meg)
function addMobileBack(win) {
  const tb = $('.titlebar', win);
  if (!tb || $('.m-back', tb)) return;
  const b = el('span', 'm-back', '‹');
  b.title = 'Vissza';
  b.addEventListener('click', e => { e.stopPropagation(); mobileBack(); });
  tb.insertBefore(b, tb.firstChild);
}

// ---------- ablakok átméretezése minden oldalról ----------
const RESIZE_EDGES = ['n', 's', 'e', 'w', 'ne', 'nw', 'se', 'sw'];

function makeResizable(win) {
  if (win.dataset.resizable) return;
  win.dataset.resizable = '1';
  for (const dir of RESIZE_EDGES) {
    const h = el('div', 'rs rs-' + dir);
    h.addEventListener('mousedown', ev => {
      if (isMobile()) return;
      ev.preventDefault();
      ev.stopPropagation();
      bringToFront(win);
      const z = (parseInt(localStorage.getItem('msn75_scale') || '0', 10) || defaultScale()) / 100;
      const sx = ev.clientX / z, sy = ev.clientY / z;
      const x0 = win.offsetLeft, y0 = win.offsetTop;
      const w0 = win.offsetWidth, h0 = win.offsetHeight;
      const minW = 260, minH = 180;

      function mv(e) {
        const dx = e.clientX / z - sx;
        const dy = e.clientY / z - sy;
        let x = x0, y = y0, w = w0, hh = h0;
        if (dir.includes('e')) w = Math.max(minW, w0 + dx);
        if (dir.includes('s')) hh = Math.max(minH, h0 + dy);
        if (dir.includes('w')) {
          w = Math.max(minW, w0 - dx);
          x = x0 + (w0 - w);
        }
        if (dir.includes('n')) {
          hh = Math.max(minH, h0 - dy);
          y = y0 + (h0 - hh);
        }
        win.style.left = Math.max(0, x) + 'px';
        win.style.top = Math.max(0, y) + 'px';
        win.style.width = w + 'px';
        win.style.height = hh + 'px';
      }
      function up() {
        removeEventListener('mousemove', mv);
        removeEventListener('mouseup', up);
      }
      addEventListener('mousemove', mv);
      addEventListener('mouseup', up);
    });
    win.appendChild(h);
  }
}

// ---------- ablakok mozgatása ----------
function makeDraggable(win, handle) {
  const tBtns = $('.t-btns', win);
  if (tBtns && !$('.tbtn.min', tBtns)) {
    const minBtn = el('span', 'tbtn min', '🗕');
    minBtn.title = 'Minimalizálás';
    minBtn.addEventListener('click', e => {
      e.stopPropagation();
      minimizeWin(win);
    });
    tBtns.insertBefore(minBtn, tBtns.firstChild);
  }
  handle.addEventListener('mousedown', ev => {
    if (ev.target.closest('.tbtn')) return;
    bringToFront(win);
    if (win.style.transform || getComputedStyle(win).transform !== 'none') {
      const r = win.getBoundingClientRect();
      win.style.transform = 'none';
      win.style.left = r.left + 'px';
      win.style.top = r.top + 'px';
    }
    const sx = ev.clientX - win.offsetLeft;
    const sy = ev.clientY - win.offsetTop;
    function mv(e) {
      win.style.left = Math.max(0, Math.min(window.innerWidth - 60, e.clientX - sx)) + 'px';
      win.style.top  = Math.max(0, Math.min(window.innerHeight - 30, e.clientY - sy)) + 'px';
    }
    function up() { removeEventListener('mousemove', mv); removeEventListener('mouseup', up); }
    addEventListener('mousemove', mv);
    addEventListener('mouseup', up);
  });
  win.addEventListener('mousedown', () => bringToFront(win));
  makeResizable(win);
  updateTaskbar();
}

// ---------- menü-építő ----------
function buildMenus(bar, menus, onAction) {
  bar.innerHTML = '';
  const closeAll = () => {
    bar.querySelectorAll('.menu-pop').forEach(p => { p.style.display = 'none'; });
    bar.querySelectorAll('.m-item').forEach(m => m.classList.remove('open'));
  };
  for (const menu of menus) {
    const mi = el('span', 'm-item', menu.label);
    bar.appendChild(mi);
    const pop = el('div', 'menu-pop');
    for (const it of menu.items) {
      if (it === '-') { pop.appendChild(el('div', 'mp-sep')); continue; }
      const item = el('div', 'mp-item' + (it.dis ? ' dis' : '') + (it.checked ? ' checked' : ''), it.label);
      if (!it.dis && it.act) {
        item.addEventListener('click', e => {
          e.stopPropagation();
          closeAll();
          onAction(it.act);
        });
      }
      pop.appendChild(item);
    }
    bar.appendChild(pop);
    mi.addEventListener('click', e => {
      e.stopPropagation();
      const isOpen = pop.style.display === 'block';
      closeAll();
      if (!isOpen) {
        pop.style.display = 'block';
        pop.style.left = mi.offsetLeft + 'px';
        mi.classList.add('open');
      }
    });
  }
  document.addEventListener('click', closeAll);
  return closeAll;
}

function doLogin() {
  const name = $('#inName').value.trim();
  const id = $('#inPeerId').value.trim();
  const err = $('#loginErr');
  err.textContent = '';
  if (!name) { err.textContent = t('errName'); return; }
  if (!/^[a-zA-Z0-9_-]{3,40}$/.test(id)) { err.textContent = t('errPeerId'); return; }
  me.name = name;
  me.id = id;
  me.status = $('#inStatus').value;
  if ($('#chkRemember').checked) {
    localStorage.setItem('msn75_login', JSON.stringify({ name, id, status: me.status, pm: me.pm }));
  } else {
    localStorage.removeItem('msn75_login');
  }
  $('#loginBtn').disabled = true;
  $('#loginStatus').textContent = t('connecting');

  me.baseId = id;
  startPeerWithSlot(id, 1);
}

// megpróbáljuk a fiók azonosítóját; ha foglalt (másik eszköz már bent
// van vele), automatikusan a következő eszköz-helyet kapjuk
function startPeerWithSlot(base, slot) {
  const err = $('#loginErr');
  const actual = slotId(base, slot);
  me.id = actual;

  if (peer && !peer.destroyed) {
    try { peer.destroy(); } catch {}
    peer = null;
  }

  const token = Math.random().toString(36).substring(2);
  peer = new Peer(actual, { debug: 1, config: RTC_CONFIG, token });

  let loginTimer = setTimeout(() => {
    if ($('#loginWin').style.display !== 'none') {
      if (slot < DEVICE_SLOTS) {
        startPeerWithSlot(base, slot + 1);
      } else {
        const randSlot = Math.floor(Math.random() * 899) + 100;
        startPeerWithSlot(base, randSlot);
      }
    }
  }, 6000);

  peer.on('open', () => {
    clearTimeout(loginTimer);
    $('#loginWin').style.display = 'none';
    $('#mainWin').style.display = 'flex';
    mobileStack.length = 0;
    mobileShow($('#mainWin'));
    applyDeskLayout();
    $('#meName').textContent = me.name;
    $('#meId').textContent = me.baseId;
    if (me.id !== me.baseId) {
      $('#meId').title = t('deviceSlot') + ' (' + me.id + ')';
    }
    $('#meStatus').value = me.status;
    $('#meStText').textContent = '(' + stText(me.status) + ')';
    $('#myDp').innerHTML = dpHtml(me.id);
    loadAccountData();
    renderPm();
    setNetState(true);
    sndOnline();
    renderContacts();
    startPresenceLoop();
    setTimeout(checkUpdate, 3000);
  });

  peer.on('connection', c => {
    setupConn(c, true);
  });
  peer.on('call', call => handleIncomingCall(call));

  peer.on('disconnected', () => {
    setNetState(false);
    try { peer.reconnect(); } catch {}
  });

  peer.on('error', e => {
    clearTimeout(loginTimer);
    if (e.type === 'unavailable-id') {
      try { peer.destroy(); } catch {}
      peer = null;
      if (slot < DEVICE_SLOTS) {
        $('#loginStatus').textContent = t('connecting') + ' (' + (slot + 1) + ')';
        setTimeout(() => startPeerWithSlot(base, slot + 1), 80);
      } else {
        const randSlot = Math.floor(Math.random() * 899) + 100;
        setTimeout(() => startPeerWithSlot(base, randSlot), 80);
      }
    } else if (e.type === 'network' || e.type === 'server-error' || e.type === 'socket-error' || e.type === 'socket-closed') {
      if (slot < DEVICE_SLOTS) {
        $('#loginStatus').textContent = t('connecting') + ' (' + (slot + 1) + ')';
        try { peer.destroy(); } catch {}
        peer = null;
        setTimeout(() => startPeerWithSlot(base, slot + 1), 1200);
      } else {
        $('#loginBtn').disabled = false;
        $('#loginStatus').textContent = '';
        err.textContent = t('errNet') + ' ' + (e.type ? '(' + e.type + ')' : '');
      }
    } else if (e.type === 'peer-unavailable') {
      // a jelenlét-figyelő újrapróbálja
    } else {
      $('#loginBtn').disabled = false;
      $('#loginStatus').textContent = '';
      err.textContent = t('errNet') + (e.type ? ' (' + e.type + ')' : '');
      try { peer.destroy(); } catch {}
      peer = null;
    }
  });
}

function setNetState(ok) {
  const n = $('#netState');
  if (!n) return;
  n.textContent = ok ? t('netOk') : t('netBad');
  n.className = ok ? 'ok' : 'bad';

  }
});

  img.onload = () => {
    const cv = document.createElement('canvas');
    const S = 384; // nagy felbontás: a chatben és nagyítva sem torzul
    cv.width = S; cv.height = S;
    const ctx = cv.getContext('2d');
    ctx.imageSmoothingQuality = 'high';
    const s = Math.min(img.width, img.height);
    ctx.drawImage(img, (img.width - s) / 2, (img.height - s) / 2, s, s, 0, 0, S, S);
    myDp = cv.toDataURL('image/jpeg', 0.92);
    localStorage.setItem('msn75_mydp', myDp);
    URL.revokeObjectURL(url);
    refreshDps(me.id);
    broadcast({ t: 'dp', data: myDp });
  };
  img.onerror = () => URL.revokeObjectURL(url);
  img.src = url;
});

function broadcast(obj) {
  for (const m of deviceConns.values()) {
    for (const c of m.values()) if (c.open) { try { c.send(obj); } catch {} }
  }
}

// ---------- adatkapcsolatok ----------
function setupConn(c, incoming) {
  const base = baseOf(c.peer);

  c.on('open', () => {
    const wasOnline = conns.has(base);
    addDeviceConn(base, c);
    // a fő kapcsolat a partnerhez (a többi eszköze is megkapja az üzeneteket)
    conns.set(base, c);
    c.send({ t: 'hello', name: me.name, status: me.status, pm: me.pm,
             base: me.baseId, dp: myDp || undefined });
    if (incoming && !contacts.find(x => x.id === base)) {
      contacts.push({ id: base, name: base });
      saveContacts();
    }
    if (!wasOnline) sndOnline();
    renderContacts();
  });

  c.on('data', d => onData(base, d));

  const drop = () => {
    removeDeviceConn(base, c.peer);
    const still = deviceConns.get(base);
    if (still && still.size) {
      // másik eszköze még bent van — a partner online marad
      conns.set(base, [...still.values()][0]);
      return;
    }
    if (conns.get(base) === c || !conns.has(base)) conns.delete(base);
    const r = remote.get(base);
    if (r && chatWins.has(base)) sysMsg(base, tf('left', r.name || base));
    remote.delete(base);
    renderContacts();
    refreshChatHead(base);
  };
  c.on('close', drop);
  c.on('error', drop);
}

function connectTo(base) {
  if (!peer || peer.destroyed || peer.disconnected) return;
  if (base === me.baseId) return;
  const known = deviceConns.get(base);
  for (let n = 1; n <= DEVICE_SLOTS; n++) {
    const pid = slotId(base, n);
    if (pid === me.id) continue;
    if (known && known.has(pid)) continue;
    const c = peer.connect(pid, { reliable: true });
    setupConn(c, false);
  }
}

function onData(pid, d) {
  if (!d || typeof d !== 'object') return;
  switch (d.t) {
    case 'hello': {
      remote.set(pid, {
        name: String(d.name || pid).slice(0, 40),
        status: d.status || 'online',
        pm: String(d.pm || '').slice(0, 80),
        dp: typeof d.dp === 'string' && d.dp.startsWith('data:image/') && d.dp.length < 900000 ? d.dp : null,
      });
      const ct = contacts.find(x => x.id === pid);
      if (ct && (ct.name === ct.id || !ct.name)) { ct.name = remote.get(pid).name; saveContacts(); }
      renderContacts();
      refreshChatHead(pid);
      refreshDps(pid);
      break;
    }
    case 'status': {
      const r = remote.get(pid);
      if (r) { r.status = d.status; renderContacts(); refreshChatHead(pid); }
      break;
    }
    case 'pm': {
      const r = remote.get(pid);
      if (r) { r.pm = String(d.pm || '').slice(0, 80); renderContacts(); }
      break;
    }
    case 'dp': {
      const r = remote.get(pid);
      if (r) {
        r.dp = typeof d.data === 'string' && d.data.startsWith('data:image/') && d.data.length < 900000 ? d.data : null;
        refreshDps(pid);
      }
      break;
    }
    case 'msg': {
      const isNew = !chatWins.has(pid) || chatWins.get(pid).win.style.display === 'none';
      openChat(pid);
      addMsg(pid, dispName(pid), String(d.text).slice(0, 4000), false, d.fmt, d.rp, { remoteId: d.mid });
      if (isNew) sndAlert(); else sndMsg();
      break;
    }
    case 'msg-edit': {
      const w = chatWins.get(pid);
      if (!w || !d.mid) break;
      const target = w.msgs.querySelector('[data-msg-id="' + CSS.escape(d.mid) + '"]');
      if (target && !target.classList.contains('mine')) {
        const body = target.querySelector('.m-body');
        if (body) {
          body.innerHTML = renderBody(String(d.text).slice(0, 4000));
          let ed = target.querySelector('.m-edited');
          if (!ed) { ed = document.createElement('span'); ed.className = 'm-edited'; ed.textContent = t('edited'); target.querySelector('.m-head').appendChild(ed); }
        }
      }
      break;
    }
    case 'typing': showTyping(pid); break;
    case 'nudge': {
      openChat(pid);
      sysMsg(pid, tf('gotNudge', dispName(pid)));
      const w = chatWins.get(pid);
      if (w) { w.win.classList.remove('nudging'); void w.win.offsetWidth; w.win.classList.add('nudging'); }
      sndNudge();
      break;
    }
    case 'wink': {
      openChat(pid);
      sysMsg(pid, tf('gotWink', dispName(pid)));
      playWink(pid, d.id);
      break;
    }
    case 'bg': {
      openChat(pid);
      const w = chatWins.get(pid);
      const bg = BGS.find(b => b[0] === d.id);
      if (bg && w) $('.msgs', w.win).style.background = bg[1];
      break;
    }
    case 'ginv': onGinv(pid, d); break;
    case 'gmsg': onGmsg(pid, d); break;
    case 'img-start': onImgStart(pid, d); break;
    case 'img-chunk': onImgChunk(pid, d); break;
    case 'img-cancel': imgRx.delete(d.id); break;
    case 'vid-offer': onVidOffer(pid, d); break;
    case 'vid-request': onVidRequest(pid, d); break;
    case 'vid-stop': onVidStop(pid, d); break;
    case 'vid-start': onVidStart(pid, d); break;
    case 'vid-chunk': onVidChunk(pid, d); break;
    case 'vclip': onVclip(pid, d); break;
    case 'file-offer': onFileOffer(pid, d); break;
    case 'file-accept': onFileAccept(pid, d); break;
    case 'file-reject': {
      const tx = fileTx.get(d.id);
      if (tx && tx.pid === pid) {
        fileTx.delete(d.id);
        if (tx.lineEl) tx.lineEl.querySelector('.f-size').textContent = t('fRejected');
      }
      break;
    }
    case 'file-cancel': {
      const tx = fileTx.get(d.id);
      if (tx && tx.pid === pid) {
        tx.cancelled = true;
        fileTx.delete(d.id);
        if (tx.lineEl) tx.lineEl.querySelector('.f-size').textContent = t('fCancelled');
      }
      break;
    }
    case 'file-chunk': onFileChunk(pid, d); break;
    case 'stream-stop': {
      if (viewers.has(pid)) closeViewer(pid);
      sysMsg(pid, tf('streamTheirStop', dispName(pid)));
      break;
    }
    case 'stream-keyframe':
    case 'stream-retry': {
      // a fogadó kéri a kulcsképkockát vagy a hívás újraépítését
      const call = outCalls.get(pid);
      if (call) forceKeyFrame(call);
      if (d.t === 'stream-retry' && outCalls.has(pid) && screenStream && screenStream.active) {
        placeStreamCall(pid);
      }
      break;
    }
    case 'bye': {
      const c = conns.get(pid);
      if (c) { try { c.close(); } catch {} }
      break;
    }
  }
}

function dispName(pid) {
  if (pid === 'gemini') return 'Gemini 3.7 Flash';
  if (pid === me.id) return me.name;
  const r = remote.get(pid);
  if (r && r.name) return r.name;
  const ct = contacts.find(x => x.id === pid);
  return (ct && ct.name) || pid;
}

function renderContacts() {
  const area = $('#contactArea');
  if (!area) return;
  area.innerHTML = '';
  const online = [], offline = [];
  for (const ct of contacts) (conns.has(ct.id) ? online : offline).push(ct);

  if (geminiState.enabled) {
    const aiList = [{
      id: 'gemini',
      name: 'Gemini 3.7 Flash',
      isBot: true,
      pm: '[' + (geminiState.thinking === 'high' ? '🧠 High Thinking' : '⚡ Low Thinking') + '] ' + t('geminiBotPm')
    }];
    area.appendChild(buildGroup('✨ AI Asszisztensek (1)', aiList, true));
  }

  area.appendChild(buildGroup(t('grpOnline') + ' (' + online.length + ')', online, true));
  area.appendChild(buildGroup(t('grpOffline') + ' (' + offline.length + ')', offline, false));
}

function buildGroup(title, list, isOnline) {
  const frag = document.createDocumentFragment();
  const head = el('div', 'grp-head');
  const box = el('span', 'box', '−');
  head.appendChild(box);
  head.appendChild(document.createTextNode(title));
  frag.appendChild(head);
  const cont = el('div');
  head.addEventListener('click', () => {
    const hidden = cont.style.display === 'none';
    cont.style.display = hidden ? '' : 'none';
    box.textContent = hidden ? '−' : '+';
  });
  for (const ct of list) {
    const row = el('div', 'contact' + (isOnline ? '' : ' offline'));
    const r = remote.get(ct.id);
    if (isOnline) {
      const th = el('span', 'c-thumb');
      th.innerHTML = dpHtml(ct.id);
      row.appendChild(th);
    } else {
      const ic = el('span');
      ic.innerHTML = buddyDot('offline');
      row.appendChild(ic.firstChild);
    }
    const nm = el('span', 'c-name');
    if (ct.isBot) {
      nm.innerHTML = 'Gemini 3.7 Flash <span class="bot-tag">AI</span>';
    } else {
      nm.textContent = dispName(ct.id);
    }
    nm.title = ct.id + (r && isOnline ? ' — ' + stText(r.status) : ' — ' + t('stOffline'));
    row.appendChild(nm);
    if (isOnline) {
      let extra = '';
      if (ct.isBot) {
        extra = ct.pm;
      } else if (r) {
        if (r.status && r.status !== 'online') extra = '(' + stText(r.status) + ')';
        if (r.pm) extra = extra ? extra + ' – ' + r.pm : '– ' + r.pm;
      }
      if (extra) row.appendChild(el('span', 'c-pm', ' ' + extra));
    }
    if (!ct.isBot) {
      const x = el('span', 'c-x', '✕');
      x.title = t('delContact');
      x.addEventListener('click', ev => {
        ev.stopPropagation();
        contacts = contacts.filter(o => o.id !== ct.id);
        saveContacts();
        renderContacts();
      });
      row.appendChild(x);
    }
    row.addEventListener('dblclick', () => openChat(ct.id));
    row.addEventListener('click', () => {
      if (isOnline || isMobile() || ct.isBot) openChat(ct.id);
    });
    cont.appendChild(row);
  }
  frag.appendChild(cont);
  return frag;
}

function groupMembersArr(g) {
  return [...g.members.entries()].map(([i, n]) => ({ i, n }));

function ensureGroup(gid, ms) {
  let g = groups.get(gid);
  if (!g) {
    g = { gid, members: new Map(), w: null };
    groups.set(gid, g);
  }
  if (Array.isArray(ms)) {
    for (const m of ms) {
      if (m && typeof m.i === 'string' && /^[a-zA-Z0-9_-]{3,40}$/.test(m.i)) {
        const had = g.members.has(m.i);
        g.members.set(m.i, String(m.n || m.i).slice(0, 40));
        if (!had && m.i !== me.id && g.w) gSysMsg(g, tf('joined', m.n || m.i));
        if (m.i !== me.id) connectTo(m.i);
      }
    }
  }
  if (!g.w) openGroupWin(g);
  refreshGroupHead(g);
  return g;
}

      for (const id of g.members.keys()) {
        if (id === me.id) continue;
        const c = conns.get(id);
        if (c && c.open) c.send(inv);
      }
      refreshGroupHead(g);
      gSysMsg(g, tf('joined', dispName(pid2)));
    });
  });

  const pop = $('.emo-pop', win);
  EMO.forEach((codes, idx) => {
    const cell = el('span', 'emo-cell');
    cell.title = codes[0];
    cell.innerHTML = A
      ? '<span class="emo" style="background-position:-' + (idx * 19) + 'px 0"></span>'
      : EMO_FALLBACK[idx];
    cell.addEventListener('click', () => {
      gw.ta.value += (gw.ta.value && !gw.ta.value.endsWith(' ') ? ' ' : '') + codes[0] + ' ';
      pop.classList.remove('open');
      gw.ta.focus();
    });
    pop.appendChild(cell);
  });
  $('.emo-btn', win).addEventListener('click', e => {
    e.stopPropagation();
    pop.classList.toggle('open');
  });
  win.addEventListener('click', e => {
    if (!e.target.closest('.emo-pop') && !e.target.closest('.emo-btn')) pop.classList.remove('open');
    if (!e.target.closest('.font-pop') && !e.target.closest('.font-btn')) gFontPop.classList.remove('open');
    if (!e.target.closest('.wink-pop') && !e.target.closest('.wink-btn')) gWkPop.classList.remove('open');
  });
}
function addGroupMsg(g, name, text, fmt) {
  const m = el('div', 'msg');
  const h = el('div', 'm-head');
  h.innerHTML = tf('writes', escHtml(name)) + '<span class="m-time">' + now() + '</span>';
  m.appendChild(h);
  const b = el('div', 'm-body');
  b.innerHTML = renderBody(text);
  if (fmt) {
    const col = sanitizeColor(fmt.color);
    if (col) b.style.color = col;
    if (fmt.bold) b.style.fontWeight = 'bold';
    if (fmt.italic) b.style.fontStyle = 'italic';
    const ff = sanitizeFont(fmt.font);
    if (ff) b.style.fontFamily = ff;
  }
  m.appendChild(b);
  g.w.msgs.appendChild(m);
  bindYt(m);
  g.w.msgs.scrollTop = g.w.msgs.scrollHeight;
}
function gSysMsg(g, text) {
  const m = el('div', 'msg sys', text);
  g.w.msgs.appendChild(m);
  g.w.msgs.scrollTop = g.w.msgs.scrollHeight;
}
function onGinv(pid, d) {
  if (typeof d.gid !== 'string') return;
  const isNew = !groups.has(d.gid);
  const g = ensureGroup(d.gid, d.ms);
  g.w.win.style.display = 'flex';
  bringToFront(g.w.win);
  if (isNew) { gSysMsg(g, t('youWereAdded')); sndAlert(); }
}
async function handleGeminiGroupMention(g, rawText) {
  const query = rawText.replace(/@(gemini|ai)\b/gi, '').trim() || 'Szia Gemini!';
  if (g.w && g.w.status) g.w.status.textContent = t('geminiTyping');

  try {
    const reply = await askGemini(query, [], { thinking: geminiState.thinking });
    if (g.w && g.w.status) g.w.status.textContent = '';
    const fmt = { font: 'Segoe UI, sans-serif', color: '#1a73e8', bold: false };
    const geminiText = '✨ [Gemini 3.7 Flash (' + (geminiState.thinking === 'high' ? 'High' : 'Low') + ' Thinking)]:\n' + reply;
    
    addGroupMsg(g, 'Gemini (AI)', geminiText, fmt);
    sndMsg();

    const msg = { t: 'gmsg', gid: g.gid, ms: groupMembersArr(g), text: geminiText, fmt, senderName: 'Gemini (AI)' };
    for (const id of g.members.keys()) {
      if (id === me.id) continue;
      const c = conns.get(id);
      if (c && c.open) c.send(msg);
    }
  } catch (err) {
    if (g.w && g.w.status) g.w.status.textContent = '';
    gSysMsg(g, '⚠️ Gemini hiba: ' + err.message);
  }
}

function onGmsg(pid, d) {
  if (typeof d.gid !== 'string') return;
  const g = ensureGroup(d.gid, d.ms);
  g.w.win.style.display = 'flex';
  const name = d.senderName || g.members.get(pid) || dispName(pid);
  addGroupMsg(g, name, String(d.text).slice(0, 4000), d.fmt);
  sndMsg();
  if (/@(gemini|ai)\b/i.test(String(d.text)) && geminiState.enabled && !d.senderName) {
    handleGeminiGroupMention(g, String(d.text));
  }
}
